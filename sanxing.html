<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>三要素性格分析系统 · 星座 × 四象 × MBTI</title>
<style>
:root{
  --bg:#faf8f4; --card:#ffffff; --dark:#1e293b; --gray:#64748b; --line:#e5e2d7;
  --fire:#e15a37; --earth:#a57d2d; --air:#3787af; --water:#5a64b4;
  --nt:#5064b4; --nf:#9664be; --sj:#328a5a; --sp:#dc8c28;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","STHeiti","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--dark);line-height:1.6}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 40px}

/* 顶部 */
header{background:linear-gradient(135deg,#1e293b,#334155);color:#fff;padding:34px 20px 28px;text-align:center;border-radius:0 0 22px 22px}
header h1{font-size:24px;letter-spacing:1px}
header p{font-size:13px;color:#cbd5e1;margin-top:6px}
header .badge{display:inline-block;margin-top:10px;font-size:12px;background:rgba(255,255,255,.15);padding:3px 12px;border-radius:20px}

/* 输入区 */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card h2{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h2 .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
label{font-size:13px;color:var(--gray);display:block;margin-bottom:6px;margin-top:12px}
label:first-of-type{margin-top:0}
select{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px;background:#fff;color:var(--dark);appearance:none;-webkit-appearance:none}
.row{display:flex;gap:8px}
.row select{flex:1}
.opt-hint{font-size:12px;color:#aab;margin-top:4px}
.btn{width:100%;height:52px;border:none;border-radius:14px;font-size:17px;font-weight:600;color:#fff;background:linear-gradient(135deg,#4f46e5,#7c3aed);margin-top:18px;letter-spacing:2px}
.btn:active{opacity:.85}
.reset{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;font-size:14px;color:var(--gray);background:#fff;margin-top:10px}
/* 阳历/农历切换 */
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg-btn{flex:1;height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px;color:var(--gray);font-weight:500}
.seg-btn.active{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-color:transparent}
.leap-row{margin-top:8px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gray);margin:0}
.chk input{width:18px;height:18px;accent-color:#4f46e5}
.birth-info{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px;font-size:13px}
.birth-info span{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:20px;padding:3px 12px;color:#334155}

/* 结果区 */
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;color:#fff;margin-right:6px;margin-bottom:4px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:18px;text-align:center}
.hero .z-name{font-size:34px;font-weight:700}
.hero .z-sub{font-size:14px;color:var(--gray);margin-top:4px}
.hero .z-ele{font-size:15px;margin-top:12px}
.hero .z-ele b{padding:2px 10px;border-radius:8px;color:#fff;font-weight:600}
.block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.block h3{font-size:15px;margin-bottom:10px;padding-left:10px;border-left:4px solid;line-height:1.3}
.block p{font-size:14px;color:#475569;margin-bottom:6px}
.pill{display:inline-block;background:#f1f5f9;border:1px solid #e2e8f0;color:#334155;font-size:12px;padding:3px 10px;border-radius:20px;margin:2px 3px}
.pill.hot{background:#fff1f2;border-color:#fecdd3;color:#be123c}
.match-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.match-item{flex:1;min-width:100px;text-align:center;padding:10px 6px;border-radius:10px;color:#fff;font-size:13px}
.note{margin-top:16px;background:#f3efe6;border-radius:12px;padding:12px 14px;font-size:12px;color:#5b5144}
.hidden{display:none}
/* 二维码区 */
.qr-box{display:flex;align-items:center;gap:14px;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#f8f9fa}
.qr-box img{width:100px;height:100px;border-radius:8px;flex-shrink:0}
.qr-text{font-size:13px;color:#475569;line-height:1.5}
.qr-link{font-size:11px;color:#aab}
.footer{text-align:center;font-size:11px;color:#aab;margin-top:24px}
</style>
</head>

function lYearDays(y){var i,sum=348;for(i=0x8000;i>0x8;i>>=1){sum+=(lunarInfo[y-1900]&i)?1:0;}return sum+leapDays(y);}
function leapMonth(y){return lunarInfo[y-1900]&0xf;}
function leapDays(y){if(leapMonth(y)){return (lunarInfo[y-1900]&0x10000)?30:29;}return 0;}
function monthDays(y,m){return (lunarInfo[y-1900]&(0x10000>>m))?30:29;}
function lunar2solar(ly,lm,ld,isLeap){
  var offset=0;
  for(var y=1900;y<ly;y++) offset+=lYearDays(y);
  var leap=leapMonth(ly);
  for(var m=1;m<lm;m++){ offset+=monthDays(ly,m); if(m===leap) offset+=leapDays(ly); }
  if(isLeap) offset+=monthDays(ly,lm);
  offset+=(ld-1);
  var dt=new Date(Date.UTC(1900,0,31)+offset*86400000);
  return {y:dt.getUTCFullYear(),m:dt.getUTCMonth()+1,d:dt.getUTCDate()};
}
function solar2lunar(sy,sm,sd){
  var offset=Math.round((Date.UTC(sy,sm-1,sd)-Date.UTC(1900,0,31))/86400000);
  var y=1900,temp=0;
  for(;y<2101&&offset>0;y++){ temp=lYearDays(y); offset-=temp; }
  if(offset<0){ offset+=temp; y--; }
  var leap=leapMonth(y), isLeap=false, m=1;
  for(;m<13&&offset>0;m++){
    if(leap>0 && m===leap+1 && !isLeap){ --m; isLeap=true; temp=leapDays(y); }
    else { temp=monthDays(y,m); }
    if(isLeap && m===leap+1) isLeap=false;
    offset-=temp;
  }
  if(offset===0 && leap>0 && m===leap+1){ if(isLeap){isLeap=false;} else {isLeap=true; --m;} }
  if(offset<0){ offset+=temp; --m; }
  return {y:y,m:m,d:offset+1,isLeap:isLeap};
}

// ============ 日期显示辅助 ============
const MONTH_CN=['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];
const DAY_CN=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
let calMode='solar';

function setCal(mode){
  calMode=mode;
  const btns=document.querySelectorAll('.seg-btn');
  for(let i=0;i<btns.length;i++){ btns[i].classList.toggle('active', btns[i].getAttribute('data-cal')===mode); }
  let mo='';
  if(mode==='solar'){ for(let i=1;i<=12;i++) mo+=`<option value="${i}">${i}月</option>`; }
  else { for(let i=1;i<=12;i++) mo+=`<option value="${i}">${MONTH_CN[i-1]}</option>`; }
  $('m').innerHTML=mo;
  $('m').value = (mode==='lunar'? 4 : 5);
  $('y').value = 1990;
  $('calHint').textContent = (mode==='solar') ? '阳历（公历）日期，直接计算星座' : '农历日期，自动换算成阳历后计算星座';
  updateDays();
}

function updateDays(){
  const y=parseInt($('y').value), m=parseInt($('m').value);
  let maxD=31, isLeap=false;
  if(calMode==='lunar'){
    isLeap = $('leapChk').checked && (leapMonth(y)===m);
    maxD = isLeap ? leapDays(y) : monthDays(y,m);
  } else {
    maxD=[0,31,28,31,30,31,30,31,31,30,31,30,31][m];
    if(m===2 && (y%4===0 && (y%100!==0 || y%400===0))) maxD=29;
  }
  const cur=parseInt($('d').value)||1;
  let dOpt='';
  for(let i=1;i<=maxD;i++) dOpt+=`<option value="${i}">${calMode==='lunar'?DAY_CN[i-1]:i+'日'}</option>`;
  $('d').innerHTML=dOpt;
  $('d').value=Math.min(cur,maxD);
  // 闰月勾选框：仅当农历该年该月存在闰月时显示
  if(calMode==='lunar' && leapMonth(y)===m){
    $('leapRow').classList.remove('hidden');
  } else {
    $('leapRow').classList.add('hidden');
    $('leapChk').checked=false;
  }
}

  $('y').addEventListener('change', updateDays);
  $('m').addEventListener('change', updateDays);

function getZodiac(m, d){
  const ranges = [
    [3,21,4,19,0],[4,20,5,20,1],[5,21,6,21,2],[6,22,7,22,3],
    [7,23,8,22,4],[8,23,9,22,5],[9,23,10,23,6],[10,24,11,22,7],
    [11,23,12,21,8],[12,22,1,19,9],[1,20,2,18,10],[2,19,3,20,11],
  ];
  for(const [m1,d1,m2,d2,idx] of ranges){
    if((m===m1&&d>=d1)||(m===m2&&d<=d2)) return ZODIAC[idx];
  }
  // 摩羯跨年边界（12.22-12.31 已覆盖；1.1-1.19 也覆盖），兜底
  if(m===12&&d>=22) return ZODIAC[9];
  return ZODIAC[9];
}

function analyze(){
  const y = parseInt($('y').value), m = parseInt($('m').value), d = parseInt($('d').value);
  let lunar, sy, sm, sd;
  if(calMode==='solar'){
    sy=y; sm=m; sd=d;
    let dim=[0,31,28,31,30,31,30,31,31,30,31,30,31][m];
    if(m===2 && (y%4===0 && (y%100!==0 || y%400===0))) dim=29;
    if(d > dim){ alert('该月份没有这一天，请重新选择日期'); return; }
    lunar = solar2lunar(sy, sm, sd);
  } else {
    const isLeap = $('leapChk').checked && (leapMonth(y)===m);
    const maxD = isLeap ? leapDays(y) : monthDays(y, m);
    if(d > maxD){ alert('该农历月没有这一天，请重新选择日期'); return; }
    const s = lunar2solar(y, m, d, isLeap);
    sy=s.y; sm=s.m; sd=s.d;
    lunar = {y:y, m:m, d:d, isLeap:isLeap};
  }
  const z = getZodiac(sm, sd);
  const el = ELE[z.e];
  const mbKey = $('mbti').value;
  const mb = mbKey ? MBTI[mbKey] : null;

  const animal = '鼠牛虎兔龙蛇马羊猴鸡狗猪'[(lunar.y-4)%12];
  const lunarStr = `${lunar.y}年${lunar.isLeap?'闰':''}${MONTH_CN[lunar.m-1]}${DAY_CN[lunar.d-1]}`;

  let html = '';

  // 主卡片
  html += `<div class="hero">
    <div class="z-name" style="color:${z.c}">${z.n}</div>
    <div class="z-sub">${z.d} · 幸运色 ${z.s}</div>
    <div class="z-ele">四象：<b style="background:${el.c}">${z.e}</b></div>
    <div class="birth-info">
      <span>阳历 ${sy}年${sm}月${sd}日</span>
      <span>农历 ${lunarStr}</span>
      <span>生肖 ${animal}</span>
    </div>
    <div style="margin-top:10px;font-size:14px;color:#475569">${z.t}</div>
  </div>`;

  // 四象卡片
  html += `<div class="block">
    <h3 style="border-color:${el.c}">四象 · ${z.e} 特点</h3>
    <p>${el.t}</p>
    <p><b>MBTI 倾向：</b>${el.dir}</p>
    <p><b>代表类型：</b>${el.mb}</p>
    <p style="margin-top:8px"><b>最佳配对：</b>${el.pair}</p>
  </div>`;

  // 星座配对
  html += `<div class="block">
    <h3 style="border-color:${el.c}">星座配对倾向</h3>
    <p>${z.n}属于<b>${z.e}</b>，最佳配对星座：<b>${el.best}</b>（同象或${el.pairE}）。</p>
    <p style="font-size:13px;color:#94a3b8">四象配对规律：${ELE_PAIR[z.e]}</p>
  </div>`;

  // MBTI（可选）
  if(mb){
    html += `<div class="block">
      <h3 style="border-color:${mb.c}">MBTI · ${mbKey}（${mb.cn}）</h3>
      <p><span class="tag" style="background:${mb.c}">${mb.g}</span></p>
      <p>${mb.t}</p>
      <p><b>配对建议：</b>${mb.pair}</p>
    </div>`;
  }

  // 三要素综合小结
  const mbDir = mb ? ` + ${mbKey}（${mb.g}）` : '';
  html += `<div class="block">
    <h3 style="border-color:#4f46e5">三要素综合小结</h3>
    <p>你的分析组合：<b>${z.n}（${z.e}）${mbDir}</b></p>
    <p>${z.n}属于${z.e}，性格底色是「${el.t}」；${mb ? `MBTI ${mbKey} 的「${mb.t}」与星座特质` : 'MBTI 未填，可补充后看更完整的人格画像'}。</p>
    <p style="margin-top:6px">性格不分好坏，了解自己是为了更好地发挥长处、经营关系～</p>
  </div>`;

  html += `<button class="reset" onclick="reset()">重新分析</button>`;

  $('result').innerHTML = html;
  $('home').classList.add('hidden');
  $('result').classList.remove('hidden');
  window.scrollTo(0,0);
}

function reset(){
  $('result').classList.add('hidden');
  $('home').classList.remove('hidden');
  window.scrollTo(0,0);
}
