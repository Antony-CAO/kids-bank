<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服装制版师初赛 · 卡片复习系统</title>
<style>
:root{--bg:#f5f4f1;--card:#fff;--text:#2c2416;--muted:#8c8070;--border:#e4ddd2;--accent:#b5463a;--gold:#b8860b;--green:#2d6a4f;--blue:#1a5f8a;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:70px}
header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--border);padding:10px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
header h1{font-size:17px;color:var(--accent)}
.search-row{display:flex;gap:8px;margin-top:8px;align-items:center}
.search-row input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none}
.search-row input:focus{border-color:var(--accent)}
.btn{padding:8px 14px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;white-space:nowrap;font-family:inherit}
.btn-accent{background:var(--accent);color:#fff}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text)}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:20px;border:1px solid var(--border);font-size:13px;cursor:pointer;background:#fff}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.stats{background:var(--card);border-radius:10px;padding:10px 14px;margin:8px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;flex-wrap:wrap;gap:12px;font-size:13px}
.stats b{color:var(--accent)}
.stats span{color:var(--muted)}
.container{max-width:720px;margin:0 auto;padding:0 14px}
.card{background:var(--card);border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card .tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;color:#fff;margin-right:6px;vertical-align:1px}
.tag.single{background:var(--blue)}
.tag.multi{background:var(--gold)}
.tag.judge{background:var(--green)}
.card .no{font-size:12px;color:var(--muted);font-weight:600}
.card .q{font-size:15px;font-weight:600;margin:8px 0 12px}
.opt{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;margin:6px 0;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:14px;transition:.12s;background:#fff}
.opt:hover{border-color:var(--accent)}
.opt .box{flex-shrink:0;width:20px;height:20px;border:2px solid #c9c0b2;border-radius:4px;display:flex;align-items:center;justify-content:center;margin-top:1px;font-size:12px;color:#fff}
.opt.multi .box{border-radius:50%}
.opt.sel{border-color:var(--accent);background:#fdf5f2}
.opt.sel .box{background:var(--accent);border-color:var(--accent)}
.opt.correct{background:#e8f5e9;border-color:var(--green)}
.opt.correct .box{background:var(--green);border-color:var(--green)}
.opt.wrong{background:#fdecea;border-color:var(--accent)}
.opt.wrong .box{background:var(--accent);border-color:var(--accent)}
.opt.miss{background:#fff8e1;border-color:var(--gold)}
.opt.miss .box{background:var(--gold);border-color:var(--gold)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.feedback{display:none;margin-top:12px;padding:12px;border-radius:8px;font-size:14px}
.feedback.show{display:block}
.feedback.ok{background:#e8f5e9;border-left:3px solid var(--green)}
.feedback.no{background:#fdecea;border-left:3px solid var(--accent)}
.feedback .explain{margin-top:6px;color:var(--muted);font-size:13px}
.feedback b.ans{color:var(--green)}
.feedback b.wrongans{color:var(--accent)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:8px 14px;display:flex;gap:8px;align-items:center;z-index:100}
.nav .info{font-size:12px;color:var(--muted);margin-right:auto}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
  <h1>📇 服装制版师初赛 · 卡片复习</h1>
  <div class="search-row">
    <input id="search" placeholder="🔍 搜索题目关键词（如：温度、袖、省、号型…）" oninput="doSearch()">
    <button class="btn btn-outline" onclick="clearSearch()">清空</button>
  </div>
</header>

<div class="container">
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-f="all" onclick="setFilter('all')">全部</div>
    <div class="tab" data-f="unanswered" onclick="setFilter('unanswered')">未答</div>
    <div class="tab" data-f="wrong" onclick="setFilter('wrong')">错题(重点)</div>
    <div class="tab" data-f="right" onclick="setFilter('right')">已答对</div>
    <div class="tab" data-f="single" onclick="setFilter('single')">单选</div>
    <div class="tab" data-f="multi" onclick="setFilter('multi')">多选</div>
    <div class="tab" data-f="judge" onclick="setFilter('judge')">判断</div>
  </div>
  <div id="list"></div>
</div>

<div class="nav">
  <div class="info" id="navInfo"></div>
  <button class="btn btn-outline" onclick="exportWrong()">📤 导出错题</button>
  <button class="btn btn-outline" onclick="resetAll()">🔄 重置进度</button>
</div>

const STORE = 'fzbs_card_v1';

let state = loadState();
let currentFilter = 'all';
let searchTerm = '';

function loadState(){
  try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }
  catch(e){ return {}; }
}
function saveState(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }

function getState(gid){
  if(!state[gid]) state[gid] = {answered:false, correct:false};
  return state[gid];
}

function render(){
  updateStats();
  const list = document.getElementById('list');
  let items = CARDS;
  // 搜索过滤
  if(searchTerm){
    const kw = searchTerm.toLowerCase();
    items = items.filter(c => c.q.toLowerCase().includes(kw) || c.explain.toLowerCase().includes(kw));
  }
  // 标签过滤
  if(currentFilter === 'wrong') items = items.filter(c => getState(c.gid).answered && !getState(c.gid).correct);
  else if(currentFilter === 'right') items = items.filter(c => getState(c.gid).answered && getState(c.gid).correct);
  else if(currentFilter === 'unanswered') items = items.filter(c => !getState(c.gid).answered);
  else if(currentFilter === 'single' || currentFilter === 'multi' || currentFilter === 'judge') items = items.filter(c => c.type === currentFilter);

  if(items.length === 0){
    list.innerHTML = '<div class="empty">没有匹配的题目 🎉</div>';
    return;
  }
  list.innerHTML = items.map(c => renderCard(c)).join('');
  document.getElementById('navInfo').textContent = `当前显示 ${items.length} 题 / 共 ${CARDS.length} 题`;
}

function renderCard(c){
  const st = getState(c.gid);
  const typeClass = c.type;
  const typeLabel = c.label;
  const isMulti = c.type === 'multi';
  const optsHtml = c.opts.map((o, i) => {
    const letter = String.fromCharCode(65+i);
    return `<div class="opt ${isMulti?'multi':''}" id="o${c.gid}_${i}" onclick="toggleOpt(${c.gid}, ${i})">
      <div class="box">${letter}</div>
      <div>${letter}. ${o}</div>
    </div>`;
  }).join('');
  const answeredHtml = st.answered ? `<div class="feedback show ${st.correct?'ok':'no'}" id="fb${c.gid}">
    ${st.correct ? '✅ 答对了！' : '❌ 答错了'}
    <b class="ans">${st.correct ? '' : '正确答案：'+correctLabel(c)}</b>
    <div class="explain">💡 ${c.explain}</div>
  </div>` : `<div class="feedback" id="fb${c.gid}"></div>`;
  return `<div class="card" id="card${c.gid}" data-gid="${c.gid}">
    <span class="tag ${typeClass}">${typeLabel}</span>
    <span class="no">第 ${c.gid} 题 / 共 ${CARDS.length} 题</span>
    <div class="q">${c.q}</div>
    ${optsHtml}
    <div class="actions">
      <button class="btn btn-outline" onclick="reveal(${c.gid})">👁 看答案</button>
    </div>
    ${answeredHtml}
  </div>`;
}

function correctLabel(c){
  if(c.type === 'judge') return c.ansIdx[0] === 0 ? '正确' : '错误';
  return c.ansIdx.map(i => String.fromCharCode(65+i)).join('、');
}

function toggleOpt(gid, idx){
  const c = CARDS.find(x => x.gid === gid);
  const st = getState(gid);
  if(st.answered) return;
  const el = document.getElementById(`o${gid}_${idx}`);
  if(c.type === 'multi'){
    // 多选 toggle 集合
    if(!st.selected) st.selected = [];
    const pos = st.selected.indexOf(idx);
    if(pos >= 0) st.selected.splice(pos, 1);
    else st.selected.push(idx);
    el.classList.toggle('sel');
    saveState();
    // 选满正确答案数量时自动判分
    if(st.selected.length >= c.ansIdx.length){
      submit(gid);
    }
  } else {
    // 单选/判断：点选即判分
    c.opts.forEach((_, i) => {
      document.getElementById(`o${gid}_${i}`).classList.remove('sel');
    });
    st.selected = [idx];
    el.classList.add('sel');
    saveState();
    submit(gid);
  }
}

function submit(gid){
  const c = CARDS.find(x => x.gid === gid);
  const st = getState(gid);
  if(st.answered) return;
  if(!st.selected || st.selected.length === 0){
    return;
  }
  // 判分
  const correctSet = c.ansIdx.slice().sort().join(',');
  const userSet = st.selected.slice().sort().join(',');
  const isCorrect = userSet === correctSet;
  st.answered = true;
  st.correct = isCorrect;
  saveState();

  // 高亮
  c.opts.forEach((_, i) => {
    const el = document.getElementById(`o${gid}_${i}`);
    const isCorrectOpt = c.ansIdx.includes(i);
    const isUserOpt = st.selected.includes(i);
    if(isCorrectOpt) el.classList.add('correct');
    else if(isUserOpt) el.classList.add('wrong');
    if(isCorrectOpt && !isUserOpt) el.classList.add('miss'); // 漏选
  });

  // 反馈
  const fb = document.getElementById(`fb${gid}`);
  fb.className = 'feedback show ' + (isCorrect ? 'ok' : 'no');
  fb.innerHTML = (isCorrect ? '✅ 答对了！' : '❌ 答错了') +
    (isCorrect ? '' : ' <b class="ans">正确答案：' + correctLabel(c) + '</b>') +
    '<div class="explain">💡 ' + c.explain + '</div>';
  updateStats();
}

function reveal(gid){
  const c = CARDS.find(x => x.gid === gid);
  const st = getState(gid);
  // 直接显示答案和解析（不计入答题记录，仅查看）
  c.opts.forEach((_, i) => {
    const el = document.getElementById(`o${gid}_${i}`);
    if(c.ansIdx.includes(i)) el.classList.add('correct');
  });
  const fb = document.getElementById(`fb${gid}`);
  fb.className = 'feedback show ok';
  fb.innerHTML = '<b class="ans">正确答案：' + correctLabel(c) + '</b>' +
    '<div class="explain">💡 ' + c.explain + '</div>';
}

function updateStats(){
  const total = CARDS.length;
  let answered = 0, correct = 0, wrong = 0;
  CARDS.forEach(c => {
    const st = getState(c.gid);
    if(st.answered){ answered++; if(st.correct) correct++; else wrong++; }
  });
  document.getElementById('stats').innerHTML =
    `<span>总题 <b>${total}</b></span><span>已答 <b>${answered}</b></span><span>答对 <b style="color:var(--green)">${correct}</b></span><span>错题 <b style="color:var(--accent)">${wrong}</b></span>`;
}

function setFilter(f){
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-f="${f}"]`).classList.add('active');
  render();
}

function doSearch(){
  searchTerm = document.getElementById('search').value.trim();
  render();
}

function clearSearch(){
  document.getElementById('search').value = '';
  searchTerm = '';
  render();
}

function resetAll(){
  if(confirm('确定要重置所有答题进度吗？此操作不可恢复！')){
    localStorage.removeItem(STORE);
    state = {};
    render();
  }
}

// 导出错题：把答错的题 gid 打包成短码（与错题重练系统互通）
function exportWrong(){
  const wrongGids = CARDS.filter(c => {
    const st = getState(c.gid);
    return st.answered && !st.correct;
  }).map(c => c.gid);
  if(wrongGids.length === 0){
    alert('当前没有错题，无需导出');
    return;
  }
  const TOTAL = CARDS.length;
  const bits = new Uint8Array(Math.ceil(TOTAL/8));
  wrongGids.forEach(g => {
    const idx = g-1;
    bits[Math.floor(idx/8)] |= (1 << (idx%8));
  });
  let bin = '';
  bits.forEach(b => bin += String.fromCharCode(b));
  const code = btoa(bin).replace(/=+$/,'');
  copyText(code).then(()=>{
    alert('✅ 已复制 ' + wrongGids.length + ' 道错题的码！\n\n现在去「错题重练」网页，点【📥 导入错题】，粘贴即可。');
  }).catch(()=>{
    prompt('复制失败，请手动复制下面的码：', code);
  });
}

function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(t);
  }
  return new Promise((res, rej)=>{
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); res(); }catch(e){ rej(e); }
    document.body.removeChild(ta);
  });
}

render();
</script>
