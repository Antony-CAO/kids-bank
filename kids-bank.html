<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🏦 我的小银行</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:linear-gradient(135deg,#e0f7fa 0%,#fff9c4 100%);min-height:100vh;padding:12px;max-width:480px;margin:0 auto}
h1{text-align:center;font-size:24px;margin-bottom:4px}
.subtitle{text-align:center;color:#999;font-size:13px;margin-bottom:12px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.login-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#e0f7fa,#fff9c4);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;overflow-y:auto}
.login-box{background:#fff;border-radius:20px;padding:24px;width:90%;max-width:320px;box-shadow:0 4px 24px rgba(0,0,0,.15)}
.login-box h2{text-align:center;margin-bottom:16px;font-size:18px}
.login-box input,.login-box select{width:100%;padding:12px;border:2px solid #eee;border-radius:12px;font-size:15px;margin-bottom:10px}
.login-box input:focus{outline:none;border-color:#1565c0}
.login-btn{width:100%;padding:12px;background:#1565c0;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:4px}
.login-btn:active{transform:scale(.98)}
.balance-card{background:linear-gradient(135deg,#1565c0,#42a5f5);color:#fff;text-align:center;padding:20px 16px}
.balance-label{font-size:14px;opacity:.85}
.balance-amount{font-size:36px;font-weight:800;margin:6px 0}
.balance-sub{font-size:11px;opacity:.75}
.balance-row{display:flex;justify-content:center;gap:16px;margin-top:10px}
.balance-row div{text-align:center}
.balance-row .num{font-size:16px;font-weight:bold}
.balance-row .lbl{font-size:10px;opacity:.75}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.action-btn{padding:12px 0;border:none;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer;color:#fff}
.action-btn:active{transform:scale(.96)}
.btn-deposit{background:linear-gradient(135deg,#2e7d32,#66bb6a)}
.btn-withdraw{background:linear-gradient(135deg,#c62828,#ef5350)}
.btn-interest{background:linear-gradient(135deg,#e65100,#ffa726)}
.btn-goal{background:linear-gradient(135deg,#6a1b9a,#ab47bc)}
.btn-logout{background:#78909c;grid-column:span 2;font-size:12px;padding:8px}
.modal-mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999}
.modal{background:#fff;border-radius:20px;padding:20px;width:90%;max-width:340px}
.modal h3{text-align:center;margin-bottom:14px;font-size:16px}
.modal label{display:block;font-size:12px;color:#999;margin-bottom:4px}
.modal input,.modal select{width:100%;padding:10px;border:2px solid #eee;border-radius:10px;font-size:15px;margin-bottom:10px}
.modal input:focus{outline:none;border-color:#1565c0}
.modal input[type=number]{text-align:center}
.modal .btn-row{display:flex;gap:8px;margin-top:8px}
.modal .btn-cancel{flex:1;padding:10px;border:2px solid #ddd;background:#fff;border-radius:10px;font-size:14px;cursor:pointer}
.modal .btn-confirm{flex:1;padding:10px;border:none;border-radius:10px;font-size:14px;font-weight:bold;color:#fff;cursor:pointer}
.hidden{display:none!important}
.interest-info{background:#fff8e1;border-radius:10px;padding:10px;font-size:12px;color:#e65100;margin-top:10px}
.interest-info strong{color:#e65100}
.goal-section{margin-top:10px}
.goal-bar-bg{background:#eee;border-radius:8px;height:14px;overflow:hidden;margin:6px 0}
.goal-bar-fill{background:linear-gradient(90deg,#66bb6a,#fdd835);height:100%;border-radius:8px;transition:width .5s;text-align:right;padding-right:4px;font-size:10px;color:#fff;line-height:14px;font-weight:bold}
.goal-text{font-size:12px;color:#666}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tab-btn{flex:1;padding:8px;text-align:center;background:#fff;border-radius:8px;font-size:13px;cursor:pointer;color:#999;border:none}
.tab-btn.active{background:#1565c0;color:#fff}
.task-card{display:flex;align-items:center;padding:10px;border-radius:10px;background:#f9fbe7;margin-bottom:6px;gap:8px}
.task-card .task-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:#fff}
.task-card .task-info{flex:1}
.task-card .task-name{font-size:14px;font-weight:600}
.task-card .task-desc{font-size:10px;color:#999}
.task-card .task-amount{font-size:16px;font-weight:800;color:#2e7d32}
.task-card .task-check{width:26px;height:26px;border-radius:50%;border:2px solid #2e7d32;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;background:transparent;cursor:pointer}
.task-card .task-check:active{background:#2e7d32}
.today-badge{display:inline-block;background:#2e7d32;color:#fff;font-size:10px;padding:2px 6px;border-radius:20px;margin-left:4px}
.task-today-done{opacity:.5}
.task-today-done .task-check{background:#2e7d32;border-color:#2e7d32}
.reward-list{max-height:250px;overflow-y:auto}
.reward-item{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5;gap:8px}
.reward-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;background:#fce4ec}
.reward-info{flex:1}
.reward-title{font-size:13px;font-weight:500}
.reward-time{font-size:10px;color:#bbb}
.reward-amount{font-size:14px;font-weight:bold;color:#2e7d32}
.stat-row{display:flex;gap:6px;margin-bottom:10px}
.stat-card{flex:1;background:#f5f5f5;border-radius:10px;padding:10px 6px;text-align:center}
.stat-card .stat-num{font-size:18px;font-weight:800;color:#333}
.stat-card .stat-label{font-size:10px;color:#999}
.stat-card.green .stat-num{color:#2e7d32}
.tx-list{max-height:250px;overflow-y:auto}
.tx-item{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5;gap:8px}
.tx-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.tx-info{flex:1}
.tx-title{font-size:13px;font-weight:500}
.tx-time{font-size:10px;color:#bbb}
.tx-amount{font-size:14px;font-weight:bold}
.tx-amount.plus{color:#2e7d32}
.tx-amount.minus{color:#c62828}
.empty-tip{text-align:center;color:#ccc;padding:20px 0;font-size:13px}
</style>
</head>
<body>

<!-- 买家专用：只通过激活码进入，独立账户，看不到别人的数据 -->
<div class="login-screen" id="loginScreen">
  <div style="font-size:42px;margin-bottom:12px;">🏦</div>
  <div class="login-box">
    <h2>🏦 我的小银行</h2>
    <p style="font-size:13px;color:#999;margin-bottom:16px;text-align:center;">输入激活码以使用你的小银行</p>
    <input type="text" id="buyerCode" placeholder="请输入6位激活码" style="text-align:center;font-size:20px;letter-spacing:6px;text-transform:uppercase;">
    <button class="login-btn" style="background:#f9a825;color:#333;" onclick="buyerActivate()">激活并进入</button>
    <div style="text-align:center;margin-top:12px;"><a href="javascript:void(0)" onclick="openModal('findCode')" style="font-size:12px;color:#999;text-decoration:underline;">😯 忘记了激活码？</a></div>
  </div>
</div>

<!-- 用户主界面 -->
<div id="mainApp" class="hidden">
  <h1 id="userTitle">🏦 我的小银行</h1>
  <div class="subtitle" id="greeting">好好学习，天天存钱！</div>

  <div class="card balance-card">
    <div class="balance-label">💰 总余额</div>
    <div class="balance-amount" id="balance">¥0</div>
    <div class="balance-sub">存款 ¥<span id="savings">0</span>｜可花费 ¥<span id="spendable">0</span>｜奖励 ¥<span id="total-reward">0</span></div>
    <div class="balance-row">
      <div><div class="num" id="total-deposit">0</div><div class="lbl">总存入</div></div>
      <div><div class="num" id="total-withdraw">0</div><div class="lbl">总取出</div></div>
      <div><div class="num" id="total-interest">0</div><div class="lbl">总利息</div></div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <h3 style="font-size:15px;">🎁 今日任务 <span class="today-badge" id="today-count">0项</span></h3>
      <button style="padding:6px 12px;background:#2e7d32;color:#fff;border:none;border-radius:8px;font-size:12px;cursor:pointer;" onclick="openModal('addTask')">+ 添加</button>
    </div>
    <div id="task-list"></div>
    <div class="empty-tip hidden" id="task-empty">还没有任务</div>
  </div>

  <div class="card">
    <div class="action-grid">
      <button class="action-btn btn-deposit" onclick="openModal('deposit')">📥 存钱</button>
      <button class="action-btn btn-withdraw" onclick="openModal('withdraw')">📤 取钱</button>
      <button class="action-btn btn-interest" onclick="openModal('interest')">💰 领利息</button>
      <button class="action-btn btn-goal" onclick="openModal('goal')">🎯 设目标</button>
      <button class="action-btn btn-logout" onclick="userLogout()">🚪 退出登录</button>
    </div>
    <div class="interest-info">💡 利息规则：月利率 <strong id="rate-display">3%</strong>，满30天可领～</div>
    <div class="goal-section hidden" id="goal-section">
      <div class="goal-bar-bg"><div class="goal-bar-fill" id="goal-bar">0%</div></div>
      <div class="goal-text" id="goal-text"></div>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab(this,'tx')">📋 记录</button>
      <button class="tab-btn" onclick="switchTab(this,'reward')">🎁 明细</button>
    </div>
    <div id="tab-tx"><div class="tx-list" id="tx-list"><div class="empty-tip">暂无记录</div></div></div>
    <div id="tab-reward" class="hidden">
      <div class="stat-row">
        <div class="stat-card green"><div class="stat-num" id="stat-total">¥0</div><div class="stat-label">累计</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-today">¥0</div><div class="stat-label">今日</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-days">0</div><div class="stat-label">打卡天数</div></div>
      </div>
      <div class="reward-list" id="reward-list"><div class="empty-tip">暂无奖励</div></div>
    </div>
  </div>
</div>

<!-- 弹窗们 -->
<div class="modal-mask hidden" id="modal-addTask">
  <div class="modal">
    <h3>➕ 添加任务</h3>
    <label>任务名称</label>
    <input type="text" id="task-name-input" placeholder="例如：完成作业">
    <label>金额（元）</label>
    <input type="number" id="task-amount-input" placeholder="正数=奖励，负数=扣钱" >
    <label>图标（选填）</label>
    <input type="text" id="task-icon-input" placeholder="📚" maxlength="4" style="text-align:center;font-size:20px;">
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal('addTask')">取消</button>
      <button class="btn-confirm" style="background:#2e7d32;" onclick="addTask()">添加</button>
    </div>
  </div>
</div>

<div class="modal-mask hidden" id="modal-deposit">
  <div class="modal">
    <h3>📥 存钱</h3>
    <input type="number" id="input-deposit" placeholder="金额" onfocus="this.select()">
    <input type="text" id="note-deposit" placeholder="备注（选填）">
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal('deposit')">取消</button>
      <button class="btn-confirm" style="background:#2e7d32;" onclick="doDeposit()">存入</button>
    </div>
  </div>
</div>

<div class="modal-mask hidden" id="modal-withdraw">
  <div class="modal">
    <h3>📤 取钱</h3>
    <input type="number" id="input-withdraw" placeholder="金额" onfocus="this.select()">
    <input type="text" id="note-withdraw" placeholder="用途（选填）">
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal('withdraw')">取消</button>
      <button class="btn-confirm" style="background:#c62828;" onclick="doWithdraw()">取出</button>
    </div>
  </div>
</div>

<div class="modal-mask hidden" id="modal-interest">
  <div class="modal">
    <h3>💰 领取利息</h3>
    <div style="text-align:center;padding:12px 0;">
      <div style="font-size:12px;color:#999;">可领取</div>
      <div style="font-size:28px;font-weight:800;color:#e65100;" id="interest-amount">¥0</div>
      <div style="font-size:11px;color:#999;" id="interest-detail"></div>
    </div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal('interest')">取消</button>
      <button class="btn-confirm" style="background:#e65100;" onclick="doInterest()">领取</button>
    </div>
  </div>
</div>

<div class="modal-mask hidden" id="modal-findCode">
  <div class="modal">
    <h3>🔍 找回激活码</h3>
    <p style="font-size:13px;color:#666;text-align:center;margin-bottom:12px;">输入你当时登记的名字，可以找回激活码</p>
    <input type="text" id="findCode-name" placeholder="请输入你的名字">
    <div id="findCode-result" style="text-align:center;padding:8px 0;font-size:14px;display:none;"></div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal('findCode')">关闭</button>
      <button class="btn-confirm" style="background:#1565c0;" onclick="doFindCode()">查找</button>
    </div>
  </div>
</div>

<div class="modal-mask hidden" id="modal-goal">
  <div class="modal">
    <h3>🎯 设目标</h3>
    <input type="text" id="goal-name" placeholder="目标名称">
    <input type="number" id="goal-amount" placeholder="目标金额">
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal('goal')">取消</button>
      <button class="btn-confirm" style="background:#6a1b9a;" onclick="doGoal()">确定</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://hmkvyxutgrahicfrgxec.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhta3Z5eHV0Z3JhaGljZnJneGVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMDUwMTMsImV4cCI6MjA5NDc4MTAxM30.fTjhNprvTkKf7vsvnyY6lYBNffUHSoKzcOu7J1Wq5IE';

let supabaseClient = null;
const TODAY = new Date().toISOString().slice(0,10);
let currentUserData = null;
let currentUserId = null;
const MY_ID_KEY = 'kids_bank_myid';

// 初始化 Supabase
function initSupabase() {
  if (typeof window.supabase !== 'undefined') {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    initApp();
  } else {
    console.error('Supabase JS not loaded');
    setTimeout(initSupabase, 500);
  }
}

async function save() {
  if (!currentUserId || !currentUserData || !supabaseClient) return;
  // 构建只包含数据库已有字段的更新对象
  const updates = {};
  const allowedFields = ['name','password','activate_code','balance','savings','spendable','total_deposit','total_withdraw','total_interest','rate','tasks','transactions','deposits','daily_check','goal','last_interest_date'];
  for (const k of allowedFields) {
    if (currentUserData[k] !== undefined) updates[k] = currentUserData[k];
  }
  // rewards/total_reward/next_task_id 存到 tasks 和 transactions 里
  const { error } = await supabaseClient
    .from('users')
    .update(updates)
    .eq('id', currentUserId);
  if (error) console.error('Save failed:', error);
}

// 初始化：检查是否已激活过（localStorage 记住身份）
async function initApp() {
  if (!supabaseClient) return;
  
  const myId = localStorage.getItem(MY_ID_KEY);
  if (myId) {
    const { data, error } = await supabaseClient
      .from('users')
      .select('*')
      .eq('id', myId)
      .single();
    
    if (data) {
      currentUserId = data.id;
      currentUserData = data;
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      initUser();
      return;
    }
  }
}

async function buyerActivate() {
  if (!supabaseClient) return alert('系统初始化失败，请刷新页面重试');
  
  const code = document.getElementById('buyerCode').value.trim().toUpperCase();
  if (!code) return alert('请输入激活码！');
  
  const { data, error } = await supabaseClient
    .from('users')
    .select('*')
    .eq('activate_code', code)
    .single();
  
  if (error || !data) return alert('激活码无效！请检查后重试。');
  
  // 不再检查 activated 字段（表中无此字段）
  
  currentUserId = data.id;
  currentUserData = data;
  localStorage.setItem(MY_ID_KEY, data.id);
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('buyerCode').value = '';
  initUser();
  alert('🎉 激活成功！' + data.name + '，欢迎来到小银行！');
}

function userLogout() {
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  currentUserId = null;
  currentUserData = null;
  localStorage.removeItem(MY_ID_KEY);
  document.getElementById('buyerCode').value = '';
}

function getUser() {
  // 确保缺失字段有默认值
  if (!currentUserData.rewards) currentUserData.rewards = [];
  if (!currentUserData.total_reward) currentUserData.total_reward = 0;
  return currentUserData;
}
function timeStr() { const n=new Date(); return n.getMonth()+1 + '/' + n.getDate() + ' ' + n.getHours() + ':' + String(n.getMinutes()).padStart(2,'0'); }
function getToday() { return currentUserData.daily_check ? (currentUserData.daily_check[TODAY] || {}) : {}; }

function initUser() {
  if (!currentUserData) return;
  const u = getUser();
  document.getElementById('userTitle').textContent = '🏦 ' + u.name + '的小银行';
  document.getElementById('greeting').textContent = u.name + '，好好学习，天天存钱！';
  document.getElementById('rate-display').textContent = u.rate + '%';
  render();
}

async function render() {
  if (!currentUserData) return;
  const u = getUser();
  document.getElementById('balance').textContent = '¥' + u.balance;
  document.getElementById('savings').textContent = u.savings;
  document.getElementById('spendable').textContent = u.spendable;
  document.getElementById('total-deposit').textContent = u.total_deposit;
  document.getElementById('total-withdraw').textContent = u.total_withdraw;
  document.getElementById('total-interest').textContent = u.total_interest;
  document.getElementById('total-reward').textContent = u.total_reward;
  renderTasks(); renderTx(); renderReward(); renderGoal();
}

function renderTasks() {
  if (!currentUserData) return;
  const u = getUser();
  const container = document.getElementById('task-list');
  const empty = document.getElementById('task-empty');
  const today = getToday();
  document.getElementById('today-count').textContent = Object.keys(today).length + '项';
  if (u.tasks.length === 0) { container.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  container.innerHTML = u.tasks.map(t => {
    const done = today[t.id];
    return `
      <div class="task-card ${done ? 'task-today-done' : ''}">
        <div class="task-icon">${t.icon || '🎁'}</div>
        <div class="task-info">
          <div class="task-name">${t.name}${done ? ' <span class="today-badge">已完成</span>' : ''}</div>
          <div class="task-desc">${done ? '再次点击✓可取消' : (t.amount >= 0 ? '点击✓领取奖励' : '点击✓扣钱')}</div>
        </div>
        <div class="task-amount" style="color:${t.amount >= 0 ? '#2e7d32' : '#c62828'}">${t.amount >= 0 ? '+' : ''}¥${t.amount}</div>
        <button class="task-check" onclick="toggleReward(${t.id})" style="${done ? 'background:#2e7d32;border-color:#2e7d32;' : ''}">✓</button>
        <button style="width:22px;height:22px;border-radius:50%;border:none;background:#ffcdd2;color:#c62828;font-size:12px;cursor:pointer;padding:0;flex-shrink:0;" onclick="deleteTask(${t.id})">✕</button>
      </div>
    `;
  }).join('');
}

async function toggleReward(taskId) {
  if (!currentUserData) return;
  const u = getUser();
  const today = getToday();
  const task = u.tasks.find(t => t.id === taskId);
  if (!task) return;
  if (today[taskId]) {
    u.balance -= task.amount; u.spendable -= task.amount; u.total_reward -= task.amount;
    delete u.daily_check[TODAY][taskId];
    const idx = u.rewards.findLastIndex(r => r.note === task.name && r.amount === task.amount && r.date === TODAY);
    if (idx >= 0) u.rewards.splice(idx, 1);
    const tidx = u.transactions.findLastIndex(t => t.type === 'reward' && t.note === task.name && t.amount === task.amount);
    if (tidx >= 0) u.transactions.splice(tidx, 1);
    await save(); render();
  } else {
    u.balance += task.amount; u.spendable += task.amount; u.total_reward += task.amount;
    const time = timeStr();
    u.rewards.push({ amount: task.amount, note: task.name, time, date: TODAY });
    u.transactions.push({ type: 'reward', amount: task.amount, note: task.name, time, typeName: '奖励' });
    if (!u.daily_check[TODAY]) u.daily_check[TODAY] = {};
    u.daily_check[TODAY][taskId] = true;
    await save(); render();
    if (navigator.vibrate) navigator.vibrate(50);
  }
}

async function deleteTask(taskId) {
  if (!currentUserData) return;
  if (!confirm('确定删除这个任务吗？')) return;
  const u = getUser();
  u.tasks = u.tasks.filter(t => t.id !== taskId);
  await save(); render();
}

async function addTask() {
  if (!currentUserData) return;
  const name = document.getElementById('task-name-input').value.trim();
  const amount = parseInt(document.getElementById('task-amount-input').value);
  const icon = document.getElementById('task-icon-input').value.trim() || '🎁';
  if (!name) return alert('请输入任务名称！');
  if (amount === 0 || isNaN(amount)) return alert('请输入金额（正数奖励，负数扣钱）！');
  const u = getUser();
  const maxId = u.tasks.length > 0 ? Math.max(...u.tasks.map(t => t.id)) : 0;
  u.tasks.push({ id: maxId + 1, name, amount, icon });
  await save(); render(); closeModal('addTask');
  document.getElementById('task-name-input').value = '';
  document.getElementById('task-amount-input').value = '';
  document.getElementById('task-icon-input').value = '';
}

function renderTx() {
  if (!currentUserData) return;
  const u = getUser();
  const list = document.getElementById('tx-list');
  if (u.transactions.length === 0) { list.innerHTML = '<div class="empty-tip">暂无记录</div>'; return; }
  const map = { deposit:'📥', withdraw:'📤', interest:'💰', reward:'🎁' };
  list.innerHTML = u.transactions.slice().reverse().map(tx => {
    const cls = tx.type === 'withdraw' ? 'minus' : 'plus';
    const sign = tx.type === 'withdraw' ? '-' : '+';
    return `
      <div class="tx-item">
        <div class="tx-icon" style="background:${tx.type==='deposit'?'#e8f5e9':tx.type==='withdraw'?'#ffebee':tx.type==='interest'?'#fff3e0':'#fce4ec'}">${map[tx.type]||'💰'}</div>
        <div class="tx-info"><div class="tx-title">${tx.note || tx.typeName}</div><div class="tx-time">${tx.time}</div></div>
        <div class="tx-amount ${cls}">${sign}¥${tx.amount}</div>
      </div>
    `;
  }).join('');
}

function renderReward() {
  if (!currentUserData) return;
  const u = getUser();
  const list = document.getElementById('reward-list');
  document.getElementById('stat-total').textContent = '¥' + u.total_reward;
  const todayR = u.rewards.filter(r => r.date === TODAY).reduce((s,r)=>s+r.amount,0);
  document.getElementById('stat-today').textContent = '¥' + todayR;
  document.getElementById('stat-days').textContent = Object.keys(u.daily_check).length;
  if (u.rewards.length === 0) { list.innerHTML = '<div class="empty-tip">暂无奖励</div>'; return; }
  list.innerHTML = u.rewards.slice().reverse().map(r => `
    <div class="reward-item">
      <div class="reward-icon">🎁</div>
      <div class="reward-info"><div class="reward-title">${r.note}</div><div class="reward-time">${r.time}</div></div>
      <div class="reward-amount">+¥${r.amount}</div>
    </div>
  `).join('');
}

function renderGoal() {
  if (!currentUserData) return;
  const u = getUser();
  const sec = document.getElementById('goal-section');
  if (!u.goal) { sec.classList.add('hidden'); return; }
  sec.classList.remove('hidden');
  const pct = Math.min(100, Math.round(u.balance / u.goal.amount * 100));
  document.getElementById('goal-bar').style.width = pct + '%';
  document.getElementById('goal-bar').textContent = pct + '%';
  document.getElementById('goal-text').innerHTML = pct >= 100
    ? '<span style="color:#2e7d32;font-weight:bold;">🎉 恭喜！已达「' + u.goal.name + '」目标！</span>'
    : '目标：' + u.goal.name + '｜还差 ¥' + (u.goal.amount - u.balance);
}

function calcInterest() {
  if (!currentUserData) return 0;
  const u = getUser();
  const now = new Date();
  const last = u.last_interest_date ? new Date(u.last_interest_date) : null;
  let eligible = 0;
  u.deposits.forEach(d => {
    const months = Math.floor((now - new Date(d.date)) / (86400000 * 30));
    if (months > 0) {
      const lastM = last ? Math.floor((last - new Date(d.date)) / (86400000 * 30)) : 0;
      if (months - lastM > 0) eligible += Math.round(d.amount * u.rate / 100 * (months - lastM));
    }
  });
  return eligible;
}

async function doDeposit() {
  if (!currentUserData) return;
  const amt = parseInt(document.getElementById('input-deposit').value);
  if (!amt || amt <= 0) return alert('请输入金额！');
  const u = getUser();
  const note = document.getElementById('note-deposit').value || '存钱';
  u.balance += amt; u.spendable += amt; u.total_deposit += amt; u.savings += amt;
  u.deposits.push({ amount: amt, date: new Date().toISOString() });
  u.transactions.push({ type: 'deposit', amount: amt, note, time: timeStr(), typeName: '存钱' });
  await save(); render(); closeModal('deposit');
  document.getElementById('input-deposit').value = '';
  document.getElementById('note-deposit').value = '';
}

async function doWithdraw() {
  if (!currentUserData) return;
  const amt = parseInt(document.getElementById('input-withdraw').value);
  const u = getUser();
  if (!amt || amt <= 0) return alert('请输入金额！');
  if (amt > u.spendable) return alert('余额不足！');
  const note = document.getElementById('note-withdraw').value || '取钱';
  u.balance -= amt; u.spendable -= amt; u.total_withdraw += amt;
  u.transactions.push({ type: 'withdraw', amount: amt, note, time: timeStr(), typeName: '取钱' });
  await save(); render(); closeModal('withdraw');
  document.getElementById('input-withdraw').value = '';
  document.getElementById('note-withdraw').value = '';
}

async function doInterest() {
  if (!currentUserData) return;
  const eligible = calcInterest();
  if (eligible <= 0) return closeModal('interest');
  const u = getUser();
  u.balance += eligible; u.spendable += eligible; u.total_interest += eligible;
  u.last_interest_date = new Date().toISOString();
  u.transactions.push({ type: 'interest', amount: eligible, note: '利息', time: timeStr(), typeName: '利息' });
  await save(); render(); closeModal('interest');
}

async function doGoal() {
  if (!currentUserData) return;
  const name = document.getElementById('goal-name').value.trim();
  const amount = parseInt(document.getElementById('goal-amount').value);
  if (!name || !amount) return alert('请输入完整！');
  getUser().goal = { name, amount };
  await save(); render(); closeModal('goal');
}

async function doFindCode() {
  if (!supabaseClient) return alert('系统初始化失败');
  
  const name = document.getElementById('findCode-name').value.trim();
  if (!name) return alert('请输入名字！');
  
  const { data, error } = await supabaseClient
    .from('users')
    .select('activate_code')
    .eq('name', name)
    .single();
  
  const result = document.getElementById('findCode-result');
  result.style.display = 'block';
  
  if (data) {
    result.innerHTML = '<div style="font-size:12px;color:#999;margin-bottom:6px;">你的激活码是</div><div style="font-size:28px;font-weight:800;letter-spacing:6px;color:#e65100;">' + data.activate_code + '</div><div style="font-size:11px;color:#999;margin-top:4px;">用这个码重新激活即可</div>';
  } else {
    result.innerHTML = '<div style="color:#c62828;">没找到这个名字，请联系管理员确认</div>';
  }
}

document.getElementById('findCode-name').addEventListener('input', function() {
  document.getElementById('findCode-result').style.display = 'none';
});

function openModal(type) {
  if (type === 'interest') {
    const eligible = calcInterest();
    document.getElementById('interest-amount').textContent = '¥' + eligible;
    document.getElementById('interest-detail').textContent = eligible > 0 ? '可领取' : '未满30天';
  }
  document.getElementById('modal-' + type).classList.remove('hidden');
}
function closeModal(type) { document.getElementById('modal-' + type).classList.add('hidden'); }
function switchTab(btn, tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-tx').classList.toggle('hidden', tab !== 'tx');
  document.getElementById('tab-reward').classList.toggle('hidden', tab !== 'reward');
}

document.querySelectorAll('.modal-mask').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.add('hidden'); });
});

initSupabase();
</script>
