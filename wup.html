<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>五年级英语 · 每日背默系统</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f5f7fb;color:#1e293b;overflow:hidden;}
  .wrap{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;}

  /* 头部 */
  header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:16px 16px 14px;flex:0 0 auto;}
  header h1{font-size:20px;font-weight:900;letter-spacing:1px;}
  header .sub{font-size:12px;opacity:.85;margin-top:4px;}
  .progress{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .progress .bar{flex:1;height:8px;background:#ffffff33;border-radius:99px;overflow:hidden;}
  .progress .bar i{display:block;height:100%;background:#fbbf24;border-radius:99px;transition:.3s;}
  .progress .txt{font-size:12px;font-weight:700;white-space:nowrap;}

  /* 标签页 */
  nav{flex:0 0 auto;display:flex;background:#fff;border-bottom:1px solid #e2e8f0;}
  nav .tab{flex:1;text-align:center;padding:12px 0;font-size:14px;font-weight:700;color:#64748b;
    cursor:pointer;position:relative;}
  nav .tab.on{color:#4f46e5;}
  nav .tab.on::after{content:'';position:absolute;left:20%;right:20%;bottom:0;height:3px;
    background:#4f46e5;border-radius:3px 3px 0 0;}

  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;}
  .page{display:none;}
  .page.on{display:block;}

  /* 今日任务 */
  .daycard{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:12px;}
  .daycard .dayhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .daycard .daytitle{font-size:17px;font-weight:900;color:#4f46e5;}
  .daycard .done-tag{background:#22c55e;color:#fff;font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700;}
  .word-list{}
  .word-row{display:flex;align-items:center;padding:9px 4px;border-bottom:1px dashed #e2e8f0;}
  .word-row:last-child{border-bottom:none;}
  .word-row .idx{width:26px;height:26px;border-radius:50%;background:#eef2ff;color:#4f46e5;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:0 0 auto;margin-right:10px;}
  .word-row .en{font-weight:800;font-size:15px;flex:1;}
  .word-row .zh{color:#64748b;font-size:13px;}

  .btn{display:inline-block;border:none;border-radius:12px;padding:13px 0;font-size:16px;font-weight:800;
    cursor:pointer;width:100%;text-align:center;transition:.12s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 4px 0 #4338ca;}
  .btn-green{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 4px 0 #15803d;}
  .btn-ghost{background:#eef2ff;color:#4f46e5;box-shadow:0 3px 0 #c7d2fe;}
  .btn-row{display:flex;gap:10px;margin-top:12px;}
  .btn-row .btn{flex:1;}

  /* 日历 */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px;}
  .cal .d{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;background:#fff;color:#94a3b8;border:1px solid #e2e8f0;}
  .cal .d.done{background:#bbf7d0;color:#15803d;border-color:#86efac;}
  .cal .d.today{background:#4f46e5;color:#fff;border-color:#4f46e5;}
  .cal .d.lock{background:#f1f5f9;color:#cbd5e1;}

  /* 背诵卡片 */
  .card{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.07);padding:20px;text-align:center;
    min-height:300px;display:flex;flex-direction:column;justify-content:center;}
  .card .en{font-size:30px;font-weight:900;color:#1e293b;margin:6px 0;line-height:1.3;}
  .card .zh{font-size:16px;color:#64748b;}
  .card .sentence{margin-top:16px;background:#f8fafc;border-radius:10px;padding:12px;text-align:left;}
  .card .sentence .s-en{font-size:14px;color:#334155;font-weight:600;line-height:1.5;}
  .card .sentence .s-zh{font-size:12px;color:#94a3b8;margin-top:4px;}
  .card .sentence .lbl{font-size:11px;color:#7c3aed;font-weight:800;letter-spacing:1px;margin-bottom:4px;}
  .card-ctrl{display:flex;gap:10px;margin-top:14px;}
  .card-ctrl .btn{flex:1;padding:12px 0;}
  .speak-btn{background:#0ea5e9;color:#fff;box-shadow:0 3px 0 #0369a1;}
  .mic-btn{background:#f59e0b;color:#fff;box-shadow:0 3px 0 #b45309;}
  .mic-btn.listening{background:#ef4444;box-shadow:0 3px 0 #b91c1c;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  .score-badge{margin-top:12px;font-size:14px;font-weight:800;color:#16a34a;}
  .score-badge.bad{color:#ef4444;}
  .nav-ctrl{display:flex;gap:10px;margin-top:14px;align-items:center;}
  .nav-ctrl .btn{flex:1;padding:11px 0;background:#fff;color:#4f46e5;box-shadow:0 3px 0 #e2e8f0;border:1px solid #e2e8f0;}
  .nav-ctrl .pos{font-size:13px;color:#94a3b8;font-weight:700;flex:0 0 auto;}

  /* 默写 */
  .quiz-q{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:12px;}
  .quiz-q .q-zh{font-size:18px;font-weight:800;color:#1e293b;margin-bottom:4px;}
  .quiz-q .q-hint{font-size:12px;color:#94a3b8;margin-bottom:10px;}
  .quiz-q input{width:100%;padding:11px 12px;border:2px solid #e2e8f0;border-radius:10px;font-size:16px;
    outline:none;transition:.15s;}
  .quiz-q input:focus{border-color:#4f46e5;}
  .quiz-q input.right{border-color:#22c55e;background:#f0fdf4;}
  .quiz-q input.wrong{border-color:#ef4444;background:#fef2f2;}
  .quiz-q .fb{font-size:13px;margin-top:6px;font-weight:700;display:none;}
  .quiz-q .fb.show{display:block;}
  .quiz-q .fb.ok{color:#16a34a;}
  .quiz-q .fb.no{color:#ef4444;}
  .quiz-q .answer-line{margin-top:8px;font-size:13px;color:#4f46e5;font-weight:700;}

  .scorebar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e2e8f0;padding:12px 14px;
    display:flex;align-items:center;gap:10px;box-shadow:0 -2px 10px rgba(0,0,0,.06);}
  .scorebar .score{font-size:16px;font-weight:900;color:#4f46e5;white-space:nowrap;}
  .scorebar .btn{flex:1;padding:11px 0;font-size:15px;}

  .notice{background:#fef9c3;border:1px solid #fde047;border-radius:10px;padding:10px 12px;font-size:12px;
    color:#854d0e;margin-bottom:12px;line-height:1.6;}
  .notice b{color:#b45309;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 五年级英语 · 每日背默</h1>
    <div class="sub">全册 132 词 · 每天 10 个 · 共 14 天</div>
    <div class="progress">
      <div class="bar"><i id="progBar"></i></div>
      <span class="txt" id="progTxt">0/14 天</span>
    </div>
  </header>

  <nav>
    <div class="tab on" data-t="plan">📅 今日任务</div>
    <div class="tab" data-t="mem">📖 背诵</div>
    <div class="tab" data-t="quiz">✍️ 默写</div>
  </nav>

  <main>
    <!-- 今日任务 -->
    <div class="page on" id="page-plan">
      <div class="notice" id="noticeRec">🎤 <b>发音纠正说明：</b>「背诵」页每个词都有 <b>🔊 标准发音</b>（手机都能用）和 <b>🎤 跟读打分</b>（需 Chrome/Edge 浏览器，微信内置浏览器不支持跟读识别，但标准发音可用）。</div>
      <div class="daycard">
        <div class="dayhead">
          <div class="daytitle" id="dayTitle">第 1 天</div>
          <div class="done-tag" id="doneTag" style="display:none">✅ 已打卡</div>
        </div>
        <div class="word-list" id="todayList"></div>
        <div class="btn-row">
          <div class="btn btn-primary" id="goMem">📖 开始背诵</div>
          <div class="btn btn-green" id="goQuiz">✍️ 开始默写</div>
        </div>
      </div>
      <div class="daycard">
        <div class="daytitle" style="font-size:15px;color:#64748b;margin-bottom:10px;">🗓️ 打卡进度（14 天）</div>
        <div class="cal" id="calendar"></div>
      </div>
    </div>

    <!-- 背诵 -->
    <div class="page" id="page-mem">
      <div class="card" id="memCard">
        <div class="en" id="memEn">word</div>
        <div class="zh" id="memZh">中文</div>
        <div class="sentence">
          <div class="lbl">例句 · EXAMPLE</div>
          <div class="s-en" id="memSen"></div>
          <div class="s-zh" id="memSenZh"></div>
        </div>
        <div class="card-ctrl">
          <div class="btn speak-btn" id="speakBtn">🔊 发音</div>
          <div class="btn mic-btn" id="micBtn">🎤 跟读</div>
        </div>
        <div class="score-badge" id="scoreBadge" style="display:none"></div>
      </div>
      <div class="nav-ctrl">
        <div class="btn" id="prevBtn">← 上一个</div>
        <div class="pos" id="memPos">1/10</div>
        <div class="btn" id="nextBtn">下一个 →</div>
      </div>
    </div>

    <!-- 默写 -->
    <div class="page" id="page-quiz">
      <div class="notice" style="margin-bottom:12px;">✍️ 看中文写英文，写完全部点「交卷」。绿色=对，红色=错（会显示正确答案）。</div>
      <div id="quizList"></div>
      <div class="scorebar">
        <span class="score" id="quizScore">得分 0/0</span>
        <div class="btn btn-primary" id="submitBtn">📝 交卷</div>
      </div>
    </div>
  </main>
</div>

var WORDS=[];
UNITS.forEach(function(u){ WORDS=WORDS.concat(u.words); });
var PER=10;
var TOTAL_DAYS=Math.ceil(WORDS.length/PER); // 14

// ===== 存储 =====
var LSKEY_DONE="wup_done_days";      // 已完成的天数（连续）
var LSKEY_MEM="wup_mem_idx";         // 当前背诵到第几天
function getDone(){ var v=localStorage.getItem(LSKEY_DONE); return v?parseInt(v):0; }
function setDone(d){ localStorage.setItem(LSKEY_DONE,String(d)); }
function getMemIdx(){ var v=localStorage.getItem(LSKEY_MEM); return v?parseInt(v):(getDone()+1); }
function setMemIdx(d){ localStorage.setItem(LSKEY_MEM,String(d)); }

// ===== 当前天数 =====
var curDay=Math.min(getDone()+1, TOTAL_DAYS);
function dayWords(d){ var s=(d-1)*PER; return WORDS.slice(s, s+PER); }

// ===== 元素 =====
var $=function(id){return document.getElementById(id);};

// ===== 标签页切换 =====
document.querySelectorAll("nav .tab").forEach(function(t){
  t.addEventListener("click",function(){
    document.querySelectorAll("nav .tab").forEach(function(x){x.classList.remove("on");});
    document.querySelectorAll(".page").forEach(function(x){x.classList.remove("on");});
    t.classList.add("on");
    $("page-"+t.dataset.t).classList.add("on");
    if(t.dataset.t==="mem") renderMem();
    if(t.dataset.t==="quiz") renderQuiz();
  });
});

// ===== 进度条 =====
function updateProgress(){
  var done=getDone();
  $("progBar").style.width=(done/TOTAL_DAYS*100)+"%";
  $("progTxt").textContent=done+"/"+TOTAL_DAYS+" 天";
}

// ===== 日历 =====
function renderCalendar(){
  var done=getDone();
  var cal=$("calendar"); cal.innerHTML="";
  for(var i=1;i<=TOTAL_DAYS;i++){
    var d=document.createElement("div");
    d.className="d";
    if(i<=done) d.classList.add("done");
    else if(i===done+1) d.classList.add("today");
    else d.classList.add("lock");
    d.textContent=i;
    d.title="第"+i+"天";
    cal.appendChild(d);
  }
}

// ===== 今日任务 =====
function renderToday(){
  curDay=Math.min(getDone()+1, TOTAL_DAYS);
  var words=dayWords(curDay);
  $("dayTitle").textContent="第 "+curDay+" 天（"+(words.length)+" 个词）";
  var tag=$("doneTag");
  if(getDone()>=curDay){ tag.style.display="inline-block"; } else { tag.style.display="none"; }
  var list=$("todayList"); list.innerHTML="";
  words.forEach(function(w,i){
    var row=document.createElement("div"); row.className="word-row";
    row.innerHTML='<span class="idx">'+(i+1)+'</span><span class="en">'+w.en+'</span><span class="zh">'+w.zh+'</span>';
    list.appendChild(row);
  });
  updateProgress();
  renderCalendar();
}

// ===== 背诵 =====
var memIdx=0, memWords=[];
function renderMem(){
  memWords=dayWords(curDay);
  if(memIdx>=memWords.length) memIdx=0;
  showMemCard();
}
function showMemCard(){
  var w=memWords[memIdx];
  if(!w) return;
  $("memEn").textContent=w.en;
  $("memZh").textContent=w.zh;
  $("memSen").textContent=w.s;
  $("memSenZh").textContent=w.sz;
  $("memPos").textContent=(memIdx+1)+"/"+memWords.length;
  hideScore();
}
function hideScore(){ $("scoreBadge").style.display="none"; }

// ===== 发音（TTS）=====
function speak(text){
  if(!window.speechSynthesis){ return; }
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang="en-US"; u.rate=0.85;
  window.speechSynthesis.speak(u);
}

// ===== 跟读打分（SpeechRecognition）=====
function startListen(cb){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ cb({error:"not-supported"}); return; }
  var rec=new SR();
  rec.lang="en-US";
  rec.interimResults=false;
  rec.maxAlternatives=3;
  var got=false;
  rec.onresult=function(e){
    got=true;
    var text=e.results[0][0].transcript;
    cb({text:text});
  };
  rec.onerror=function(e){ if(!got) cb({error:e.error}); };
  rec.onend=function(){ if(!got) cb({error:"no-speech"}); };
  try{ rec.start(); }catch(e){ cb({error:e.message}); }
}
function normalize(s){ return (s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim(); }
function similarity(a,b){
  a=normalize(a); b=normalize(b);
  if(!a||!b) return 0;
  if(a===b) return 100;
  var m=a.length,n=b.length;
  var dp=[]; for(var i=0;i<=m;i++){dp[i]=[i];} for(var j=0;j<=n;j++){dp[0][j]=j;}
  for(var i=1;i<=m;i++)for(var j=1;j<=n;j++){
    dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  }
  var dist=dp[m][n];
  return Math.max(0, Math.round((1-dist/Math.max(m,n))*100));
}

var listening=false;
function doListen(){
  var w=memWords[memIdx]; if(!w) return;
  if(listening) return;
  listening=true;
  var mb=$("micBtn");
  mb.classList.add("listening"); mb.textContent="🎤 请跟读...";
  startListen(function(r){
    listening=false;
    mb.classList.remove("listening"); mb.textContent="🎤 跟读";
    var badge=$("scoreBadge");
    if(r.error){
      badge.style.display="block";
      badge.className="score-badge bad";
      if(r.error==="not-supported") badge.textContent="⚠️ 当前浏览器不支持跟读识别，请用 Chrome 打开；标准发音仍可用";
      else badge.textContent="⚠️ 没听清，请再说一遍（对着麦克风读单词）";
      return;
    }
    var score=similarity(w.en, r.text);
    badge.style.display="block";
    if(score>=90){ badge.className="score-badge"; badge.textContent="⭐ 太棒了！"+(score===100?"发音完全正确":"接近标准")+"（"+score+"分）"; }
    else if(score>=60){ badge.className="score-badge"; badge.textContent="👍 不错，再练练（"+score+"分）你读的是：'"+r.text+"'"; }
    else { badge.className="score-badge bad"; badge.textContent="💪 再试一次（"+score+"分）你读的是：'"+r.text+"'"; }
  });
}

// ===== 默写 =====
var quizSubmitted=false;
function renderQuiz(){
  quizSubmitted=false;
  var words=dayWords(curDay);
  var list=$("quizList"); list.innerHTML="";
  $("quizScore").textContent="共 "+words.length+" 题";
  words.forEach(function(w,i){
    var q=document.createElement("div"); q.className="quiz-q";
    q.innerHTML='<div class="q-zh">'+w.zh+'</div>'+
      '<div class="q-hint">第 '+(i+1)+' 题 · 写出英文</div>'+
      '<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-i="'+i+'" placeholder="输入英文...">'+
      '<div class="fb"></div><div class="answer-line"></div>';
    list.appendChild(q);
  });
  // 空输入不自动纠正，但支持回车跳到下一题
  list.querySelectorAll("input").forEach(function(inp){
    inp.addEventListener("keydown",function(e){
      if(e.key==="Enter"){ var n=inp.dataset.i; var next=list.querySelector('input[data-i="'+(parseInt(n)+1)+'"]'); if(next)next.focus(); }
    });
  });
}
function submitQuiz(){
  var words=dayWords(curDay);
  var inputs=$("quizList").querySelectorAll("input");
  var right=0, total=words.length;
  inputs.forEach(function(inp){
    var i=parseInt(inp.dataset.i);
    var w=words[i];
    var ans=normalize(inp.value);
    var std=normalize(w.en);
    var fb=inp.parentElement.querySelector(".fb");
    var al=inp.parentElement.querySelector(".answer-line");
    var ok=(ans===std);
    inp.classList.add(ok?"right":"wrong");
    inp.classList.remove(ok?"wrong":"right");
    fb.classList.add("show");
    if(ok){ fb.className="fb show ok"; fb.textContent="✔ 正确！"; right++; }
    else { fb.className="fb show no"; fb.textContent="✘ 拼写错误"; al.textContent="正确答案："+w.en; }
  });
  quizSubmitted=true;
  $("quizScore").textContent="得分 "+right+"/"+total;
  // 全对则自动打卡
  if(right===total){
    var done=getDone();
    if(curDay>done){ setDone(curDay); }
    renderToday();
    setTimeout(function(){ alert('🎉 太棒了！第 '+curDay+' 天 10 个单词全部默写正确，已打卡！\n明天继续第 '+(curDay+1)+' 天～'); },300);
  }
}

// ===== 事件 =====
$("goMem").addEventListener("click",function(){
  memIdx=0; renderMem();
  document.querySelectorAll("nav .tab").forEach(function(x){x.classList.remove("on");});
  document.querySelectorAll(".page").forEach(function(x){x.classList.remove("on");});
  document.querySelector('nav .tab[data-t="mem"]').classList.add("on");
  $("page-mem").classList.add("on");
});
$("goQuiz").addEventListener("click",function(){
  renderQuiz();
  document.querySelectorAll("nav .tab").forEach(function(x){x.classList.remove("on");});
  document.querySelectorAll(".page").forEach(function(x){x.classList.remove("on");});
  document.querySelector('nav .tab[data-t="quiz"]').classList.add("on");
  $("page-quiz").classList.add("on");
});
$("speakBtn").addEventListener("click",function(){ speak(memWords[memIdx].en); });
$("micBtn").addEventListener("click",doListen);
$("prevBtn").addEventListener("click",function(){ if(memIdx>0){memIdx--;showMemCard();} });
$("nextBtn").addEventListener("click",function(){ if(memIdx<memWords.length-1){memIdx++;showMemCard();} });
$("submitBtn").addEventListener("click",submitQuiz);

// 初始化
renderToday();
})();
