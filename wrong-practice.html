<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>错题重练 · 服装制版师</title>
<style>
:root{--bg:#f5f4f1;--card:#fff;--text:#2c2416;--muted:#8c8070;--border:#e4ddd2;--accent:#b5463a;--gold:#b8860b;--green:#2d6a4f;--blue:#1a5f8a;--orange:#e07b00;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.65;padding-bottom:80px}
header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--border);padding:10px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
header h1{font-size:17px;color:var(--accent)}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fff3e0,#fde8d0);border:1px solid #f0d0a0;border-radius:12px;padding:12px 16px;margin:10px 14px}
.banner .num{font-size:34px;font-weight:800;color:var(--orange);line-height:1;min-width:52px;text-align:center}
.banner .lbl{font-size:12px;color:#8a5300;flex:1}
.banner .lbl b{display:block;font-size:14px;color:#6b4300}
.tabs{display:flex;gap:6px;margin:10px 14px;flex-wrap:wrap}
.tab{flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--border);font-size:14px;cursor:pointer;background:#fff;font-weight:700;text-align:center}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab.practice-active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab.wrong-active{background:var(--orange);color:#fff;border-color:var(--orange)}
.container{max-width:720px;margin:0 auto;padding:0 14px}
.card{background:var(--card);border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card .tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;color:#fff;margin-right:6px;vertical-align:1px}
.tag.single{background:var(--blue)}
.tag.multi{background:var(--gold)}
.tag.judge{background:var(--green)}
.card .no{font-size:12px;color:var(--muted);font-weight:600}
.card .q{font-size:15px;font-weight:600;margin:8px 0 12px}
.opt{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;margin:6px 0;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:14px;transition:.12s;background:#fff}
.opt:active{border-color:var(--accent)}
.opt .box{flex-shrink:0;width:20px;height:20px;border:2px solid #c9c0b2;border-radius:4px;display:flex;align-items:center;justify-content:center;margin-top:1px;font-size:12px;color:#fff}
.opt.multi .box{border-radius:50%}
.opt.sel{border-color:var(--accent);background:#fdf5f2}
.opt.sel .box{background:var(--accent);border-color:var(--accent)}
.opt.correct{background:#e8f5e9;border-color:var(--green)}
.opt.correct .box{background:var(--green);border-color:var(--green)}
.opt.wrong{background:#fdecea;border-color:var(--accent)}
.opt.wrong .box{background:var(--accent);border-color:var(--accent)}
.opt.miss{background:#fff8e1;border-color:var(--gold)}
.opt.miss .box{background:var(--gold);border-color:var(--gold)}
.feedback{display:none;margin-top:12px;padding:12px;border-radius:8px;font-size:14px}
.feedback.show{display:block}
.feedback.ok{background:#e8f5e9;border-left:3px solid var(--green)}
.feedback.no{background:#fdecea;border-left:3px solid var(--accent)}
.feedback .explain{margin-top:6px;color:var(--muted);font-size:13px}
.feedback b.ans{color:var(--green)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}
.empty .big{font-size:44px;display:block;margin-bottom:10px}
.empty .hint{font-size:13px;margin-top:8px;color:#a99e8d}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:420px}
.modal h2{font-size:16px;color:var(--accent);margin-bottom:8px}
.modal p{font-size:13px;color:var(--muted);margin-bottom:10px}
.modal textarea{width:100%;height:90px;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;font-family:inherit;resize:vertical;outline:none}
.btn{padding:10px 18px;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;font-family:inherit}
.btn-accent{background:var(--accent);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text)}
.modal .row{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.mini{font-size:11px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-family:inherit;font-weight:600;color:var(--text)}
.toolbar{display:flex;gap:6px;margin:0 14px;justify-content:flex-end}
.msg{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#2c2416;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:.25s;pointer-events:none}
.msg.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>📕 服装制版师 · 错题重练</h1>
  <div class="sub">刷题攒错题 · 答对移出 · 专业解析</div>
</header>

<div class="banner">
  <div class="num" id="wrongNum">0</div>
  <div class="lbl"><b>道错题待攻克</b><span id="subLbl">刷题产生错题 → 错题重练</span></div>
</div>

<div class="tabs">
  <div class="tab practice-active" id="tabPractice" onclick="setMode('practice')">🆕 刷题攒错题</div>
  <div class="tab" id="tabWrong" onclick="setMode('wrong')">🔴 错题重练</div>
</div>

<div class="toolbar">
  <button class="mini" onclick="openImport()">📥 导入</button>
  <button class="mini" onclick="doExport()">📤 导出</button>
  <button class="mini" onclick="resetAll()">🔄 清空</button>
</div>

<div class="container">
  <div id="list"></div>
</div>

<div class="modal-bg" id="importModal">
  <div class="modal">
    <h2>📥 导入错题</h2>
    <p>在旧答题网页点【导出错题】复制一段码，粘贴到下面，即可恢复之前的错题。</p>
    <textarea id="importCode" placeholder="粘贴错题码…"></textarea>
    <div class="row">
      <button class="btn btn-outline" onclick="closeImport()">取消</button>
      <button class="btn btn-accent" onclick="doImport()">导入</button>
    </div>
  </div>
</div>

<div class="msg" id="msg"></div>

"内在功能性", "形式美", "机能美"], "ansIdx": [1], "explain": "正确答案：B. 内在功能性。牢记此考点。", "gid": 20, "explain_pro": "人体连接点部分（关节、颈根、肩端等）强调结构的「内在功能性」（活动机能）。"}, {"type": "single", "label": "单选", "id": 21, "q": "人体连接点部分表现为（  ）美。", "opts": ["感观效果", "内在功能性", "形式", "机能"], "ansIdx": [3], "explain": "正确答案：D. 机能。牢记此考点。", "gid": 21, "explain_pro": "人体连接点（关节）具有屈伸、旋转等运动机能，属于「机能美」——既要满足活动功能，又体现动态美感。"}, {"type": "single", "label": "单选", "id": 22, "q": "腰椎共有（  ）块。", "opts": ["5", "6", "7", "8"], "ansIdx": [0], "explain": "正确答案：A. 5。腰椎共5块，以第3腰椎为腰线标准。", "gid": 22, "explain_pro": "人体腰椎共 5 块。"}, {"type": "single", "label": "单选", "id": 23, "q": "第（  ）块腰椎常常作为服装结构的腰线标准。", "opts": ["一", "二", "三", "四"], "ansIdx": [2], "explain": "正确答案：C. 三。腰椎共5块，以第3腰椎为腰线标准。", "gid": 23, "explain_pro": "第「三」块腰椎常作为服装腰线（最细处）的标准。"}, {"type": "single", "label": "单选", "id": 24, "q": "男子Y型体胸围与腰围的差数是（  ）。", "opts": ["6~2", "11~7", "16~12", "22~17"], "ansIdx": [3], "explain": "正确答案：D. 22~17。口诀：男A十六十二，Y加六，B减五，C再减五；女的全加二（Y22~17/A16~12/B11~7/C6~2）。", "gid": 24, "explain_pro": "男子 Y 型体（偏瘦体）胸腰差 22~17cm。"}, {"type": "single", "label": "单选", "id": 25, "q": "国家标准中，女子的净胸围达到（  ）cm。", "opts": ["102", "105", "107", "109"], "ansIdx": [3], "explain": "正确答案：D. 109。牢记此考点。", "gid": 25, "explain_pro": "GB/T 1335 女子号型标准中，净胸围（型）的分档上限为 109cm，是女子体型测量的极值档。"}, {"type": "single", "label": "单选", "id": 26, "q": "西装裙的尺寸设计应属于（  ）。", "opts": ["紧身裙系列", "规律尺寸系列", "传统尺寸", "围度变化范围"], "ansIdx": [0], "explain": "正确答案：A. 紧身裙系列。牢记此考点。", "gid": 26, "explain_pro": "西装裙合体、贴合腰臀，尺寸设计属「紧身裙系列」。"}, {"type": "single", "label": "单选", "id": 27, "q": "合体西裙尺寸的设计应考虑到（  ），为使穿脱方便美观。", "opts": ["开口处的尺寸长短设定", "里布的应用", "穿着形式", "细节问题"], "ansIdx": [0], "explain": "正确答案：A. 开口处的尺寸长短设定。牢记此考点。", "gid": 27, "explain_pro": "合体西裙尺寸设计要「开口处的尺寸长短设定」（后开衩、拉链开口长度），保证穿脱方便美观。"}, {"type": "single", "label": "单选", "id": 28, "q": "完整的胸廓呈（  ）形状。", "opts": ["圆台形", "蛋形", "球形", "圆柱形"], "ansIdx": [1], "explain": "正确答案：B. 蛋形。牢记此考点。", "gid": 28, "explain_pro": "人体胸廓上窄下宽、呈「蛋形」（倒置的蛋），这是上衣原型胸省、腰省设计的体型依据。"}, {"type": "single", "label": "单选", "id": 29, "q": "纸样设计中常作为后衣片肩省和过肩线设计依据的是（  ）。", "opts": ["肩胛骨", "肱骨上端", "锁骨", "肩胛骨"], "ansIdx": [3], "explain": "正确答案：D. 肩胛骨。牢记此考点。", "gid": 29, "explain_pro": "肩胛骨（胛骨）向后隆起，是后衣片设置肩省、划分过肩线的体型依据，使后片贴合背部曲面。"}, {"type": "single", "label": "单选", "id": 30, "q": "了解人体（  ）是为了认识人体运动机能在纸样设计中的制约作用。", "opts": ["骨骼", "肌肉", "皮肤", "四肢"], "ansIdx": [0], "explain": "正确答案：A. 骨骼。牢记此考点。", "gid": 30, "explain_pro": "了解人体「骨骼」是认识人体运动机能在纸样设计中制约作用的基础。"}, {"type": "single", "label": "单选", "id": 31, "q": "人体静态时，女性的肩斜度是（  ）度。", "opts": ["19", "20", "21", "22"], "ansIdx": [1], "explain": "正确答案：B. 20。女性静态肩斜度20°。", "gid": 31, "explain_pro": "人体静态时女性肩斜度约 20°（男性约 19°，女性肩更斜）。"}, {"type": "single", "label": "单选", "id": 32, "q": "正常行走时的膝围是（  ）厘米左右。", "opts": ["58~72", "62~88", "82~109", "90~121"], "ansIdx": [2], "explain": "正确答案：C. 82~109。正常行走膝围82~109cm。", "gid": 32, "explain_pro": "正常行走时膝围约 82~109cm（膝盖活动量大，膝围数据宽）。"}, {"type": "single", "label": "单选", "id": 33, "q": "在西装和缝制中需要粘衬的部位很多，粘衬是一种重要的（  ）。", "opts": ["工序", "环节", "防变形", "技能操作"], "ansIdx": [2], "explain": "正确答案：C. 防变形。牢记此考点。", "gid": 33, "explain_pro": "粘衬是西装缝制的重要「防变形」手段（固定面料、防止起皱变形）。"}, {"type": "single", "label": "单选", "id": 34, "q": "西装缝制时，为保证胸部的造型，粘衬后还需（  ）。", "opts": ["粘衬", "覆衬", "纳衬", "含衬"], "ansIdx": [1], "explain": "正确答案：B. 覆衬。牢记此考点。", "gid": 34, "explain_pro": "西装缝制时粘衬后还需「覆衬」（在毛衬上覆一层，形成胸部挺括造型）。"}, {"type": "single", "label": "单选", "id": 35, "q": "覆胸线，是西装（  ）部位和配料。", "opts": ["挂面", "前片", "肩袖", "胸部的毛衬上"], "ansIdx": [3], "explain": "正确答案：D. 胸部的毛衬上。牢记此考点。", "gid": 35, "explain_pro": "覆胸线是西装「胸部的毛衬上」的部位和配料（胸衬的覆合线）。"}, {"type": "single", "label": "单选", "id": 36, "q": "缝袋盖，将袋盖反面粘衬，按净印与袋盖里勾缝，袋盖里应比盖面里缩（  ）。", "opts": ["0.2cm", "0.1cm", "0.5cm", "不外露"], "ansIdx": [0], "explain": "正确答案：A. 0.2cm。袋盖里比盖面里缩0.2cm（高频，考2次）。", "gid": 36, "explain_pro": "缝袋盖时袋盖里比盖面里缩「0.2cm」，使袋盖翻折后自然内收、不外翻（里缩量）。"}, {"type": "single", "label": "单选", "id": 37, "q": "风衣是（  ）的外衣。", "opts": ["外出时装", "挡风雨", "宽松有腰带的长衣", "春秋时节穿用的对开式"], "ansIdx": [3], "explain": "正确答案：D. 春秋时节穿用的对开式。牢记此考点。", "gid": 37, "explain_pro": "风衣是「春秋时节穿用的对开式」外衣，前襟对开、可敞开，兼具挡风与穿脱方便。"}, {"type": "single", "label": "单选", "id": 38, "q": "高级时装的工艺制作要求，应注意服装的（  ）。", "opts": ["做工", "配料", "工艺", "神韵"], "ansIdx": [3], "explain": "正确答案：D. 神韵。牢记此考点。", "gid": 38, "explain_pro": "高级时装（高定）工艺讲究整体的「神韵」，做工、配料、工艺最终都服务于服装的气质与神韵。"}, {"type": "single", "label": "单选", "id": 39, "q": "在服装中的硬变形是指（  ）完成从平面到曲面体的转换。", "opts": ["结构设计上", "裁片上", "熨烫工艺", "剪裁上"], "ansIdx": [0], "explain": "正确答案：A. 结构设计上。牢记此考点。", "gid": 39, "explain_pro": "「硬变形」指在结构设计阶段通过省道、分割等，把平面纸样转成立体曲面（曲面体），是结构设计的核心任务。"}, {"type": "single", "label": "单选", "id": 40, "q": "晚礼服尺寸特点（  ）长裙。", "opts": ["低胸露背", "露肩露背", "收腰贴身", "场合越高级暴露部分越多"], "ansIdx": [2], "explain": "正确答案：C. 收腰贴身。牢记此考点。", "gid": 40, "explain_pro": "晚礼服的尺寸特点是「收腰贴身」长裙，突出腰线、裙摆拖地，营造优雅修长的廓形。"}, {"type": "single", "label": "单选", "id": 41, "q": "新潮时装在设定外型尺寸时（  ）。", "opts": ["应注意各局部的细微变化", "应注意其夸张部位的尺寸变化", "应注意与同类服装的不同处", "应注意尺寸设定的准确性"], "ansIdx": [1], "explain": "正确答案：B. 应注意其夸张部位的尺寸变化。牢记此考点。", "gid": 41, "explain_pro": "新潮时装设定外型尺寸时，重点关注「夸张部位的尺寸变化」——夸张处（垫肩、宽袖、大摆等）是造型灵魂。"}, {"type": "single", "label": "单选", "id": 42, "q": "纯棉织物的熨烫温度在（  ）为最适宜温度。", "opts": ["100-120", "120-140", "140-160", "180-200"], "ansIdx": [3], "explain": "正确答案：D. 180-200。棉最耐热，适宜180-200℃。天然纤维耐热高。", "gid": 42, "explain_pro": "熨烫温度是高频考点。180-200 是适宜/危险温度。记忆：棉最耐热180-200；麻危险240最高；丝/锦纶/维纶适宜120-150（司机维）；危险温度麻240>粘胶210>丝200>涤纶190>腈纶180。危险温度必高于适宜温度。"}, {"type": "single", "label": "单选", "id": 43, "q": "麻制品织物的适宜熨烫温度为140-200，危险温度在（  ）。", "opts": ["210", "240", "230", "260"], "ansIdx": [1], "explain": "正确答案：B. 240。麻适宜140-200℃，危险240℃（全表最高）。", "gid": 43, "explain_pro": "熨烫温度是高频考点。240 是适宜/危险温度。记忆：棉最耐热180-200；麻危险240最高；丝/锦纶/维纶适宜120-150（司机维）；危险温度麻240>粘胶210>丝200>涤纶190>腈纶180。危险温度必高于适宜温度。"}, {"type": "single", "label": "单选", "id": 44, "q": "毛制品织物的服装最适宜的熨烫温度为（  ）。", "opts": ["120-160", "150-200", "200-210", "100-180"], "ansIdx": [0], "explain": "正确答案：A. 120-160。毛适宜120-160℃。", "gid": 44, "explain_pro": "熨烫温度是高频考点。120-160 是适宜/危险温度。记忆：棉最耐热180-200；麻危险240最高；丝/锦纶/维纶适宜120-150（司机维）；危险温度麻240>粘胶210>丝200>涤纶190>腈纶180。危险温度必高于适宜温度。"}, {"type": "single", "label": "单选", "id": 45, "q": "丝制品织物的宜熨烫温度在120-150，最危险温度在（  ）。", "opts": ["160", "180", "200", "220"], "ansIdx": [2], "explain": "正确答案：C. 200。丝适宜120-150℃，危险200℃。", "gid": 45, "explain_pro": "丝织物适宜熨烫 120-150℃，其最危险温度（超过即损伤）为 200℃。口诀：丝危险200。"}, {"type": "single", "label": "单选", "id": 46, "q": "高级时装是对某些人的个人需求而设计制作的，具有（  ）的时装。", "opts": ["时代特色", "不同风格", "高品味", "不同款式"], "ansIdx": [0], "explain": "正确答案：A. 时代特色。牢记此考点。", "gid": 46, "explain_pro": "高级时装针对个人需求设计制作，具有「时代特色」的时装。"}, {"type": "single", "label": "单选", "id": 47, "q": "裤料的车缝工序（  ）。", "opts": ["车缝裤袢、翻烫裤袢、缉明线", "烫裤袢、缉明线、车缝裤袢、裤袢粘衬", "缉明线、翻烫裤袢、车缝裤袢、裤袢粘衬", "翻烫裤袢、车缝裤袢、缉明线"], "ansIdx": [0], "explain": "正确答案：A. 车缝裤袢、翻烫裤袢、缉明线。牢记此考点。", "gid": 47, "explain_pro": "裤袢正确工序顺序：先「车缝裤袢」→「翻烫裤袢」→「缉明线」，最后缉明线定型。"}, {"type": "single", "label": "单选", "id": 48, "q": "男式西装上衣身长比例多为人站立时，两手垂落后的（  ）。", "opts": ["中指处", "拇指处", "虎口处", "腕骨处"], "ansIdx": [1], "explain": "正确答案：B. 拇指处。牢记此考点。", "gid": 48, "explain_pro": "男西装衣长标准：人自然站立、两手自然下垂时，衣长至「拇指处」（拇指尖）。"}, {"type": "single", "label": "单选", "id": 49, "q": "串口的高低（  ）领子长度的尺寸。", "opts": ["调整", "决定", "不影响", "改变"], "ansIdx": [1], "explain": "正确答案：B. 决定。牢记此考点。", "gid": 49, "explain_pro": "串口（领串口）的高低「决定」领子长度的尺寸。"}, {"type": "single", "label": "单选", "id": 50, "q": "男式西装的制作工艺流程头道工序应是（  ）。", "opts": ["粘前片衬", "定位", "前片缝制", "收省"], "ansIdx": [0], "explain": "正确答案：A. 粘前片衬。牢记此考点。", "gid": 50, "explain_pro": "男西装头道工序是「粘前片衬」——先给前片粘合衬定型，为后续收省、覆衬打基础。"}, {"type": "single", "label": "单选", "id": 51, "q": "对于有条、格、花纹、图案的材料，在排版方案设计时，要求铺料时应按（  ）要求对正图案。", "opts": ["设计", "技术", "工序", "次序"], "ansIdx": [0], "explain": "正确答案：A. 设计。牢记此考点。", "gid": 51, "explain_pro": "条、格、花纹、图案面料，排版铺料须按「设计」要求对位对花，保证成衣图案连贯美观。"}, {"type": "single", "label": "单选", "id": 52, "q": "西装裙的尺寸设计（  ）可按人体合体型设计。", "opts": ["腰头部", "臀围部", "腰至臀部位", "膝盖以上"], "ansIdx": [2], "explain": "正确答案：C. 腰至臀部位。牢记此考点。", "gid": 52, "explain_pro": "号型/体型 plain": "正确答案：A. 前-1、后+1。牢记此考点。", "gid": 119, "explain_pro": "直插袋西裤前后腰口比例一般为「前-1、后+1」（前腰减1cm、后腰加1cm）。"}, {"type": "single", "label": "单选", "id": 120, "q": "制作灯笼裤，其前后裆宽的选择为（  ）。", "opts": ["0.07H和0.09H", "0.08H和0.08H", "0.05H和0.11H", "0.04H和0.11H"], "ansIdx": [0], "explain": "正确答案：A. 0.07H和0.09H。前后裆宽：裙裤/灯笼裤0.07H和0.09H，喇叭裤0.05H和0.11H。", "gid": 120, "explain_pro": "制作灯笼裤，其前后裆宽选择为「0.07H和0.09H」（H=臀围，同裙裤）。"}, {"type": "single", "label": "单选", "id": 121, "q": "合体的裤装其前后臀围大小采用（  ）安排较为合理。", "opts": ["前大后小", "前后一样大", "前小后大", "随便"], "ansIdx": [2], "explain": "正确答案：C. 前小后大。牢记此考点。", "gid": 121, "explain_pro": "合体裤装前后臀围采用「前小后大」安排较合理（后臀凸起大，后片占比大）。"}, {"type": "single", "label": "单选", "id": 122, "q": "全腰口收橡筋的宽松款式，其前后的臀围大小采用（  ）安排比较合理。", "opts": ["前大后小", "前后一样大", "前小后大", "随便"], "ansIdx": [2], "explain": "正确答案：C. 前小后大。牢记此考点。", "gid": 122, "explain_pro": "全腰口收橡筋的宽松款式，前后臀围采用「前小后大」安排比较合理。"}, {"type": "single", "label": "单选", "id": 123, "q": "宽松款式中，袖笼深加深量一定要（  ）胸、背宽加宽量。", "opts": ["大于", "小于", "等于", "大于或等于"], "ansIdx": [3], "explain": "正确答案：D. 大于或等于。牢记此考点。", "gid": 123, "explain_pro": "宽松款式中，袖笼深加深量一定要「大于或等于」胸、背宽加宽量（宽松度足）。"}, {"type": "single", "label": "单选", "id": 124, "q": "在翻驳领中横开领以原型为基础作开宽处理，其前后横开领的开宽量（  ）。", "opts": ["前大于后", "后大于前", "同步", "不确定"], "ansIdx": [2], "explain": "正确答案：C. 同步。牢记此考点。", "gid": 124, "explain_pro": "翻驳领横开领以原型为基础开宽时，前后横开领开宽量「同步」（前后等量开宽）。"}, {"type": "single", "label": "单选", "id": 125, "q": "后幅有担干的款式结构中，其前后小肩线长（  ）。", "opts": ["前后相等", "前长于后", "前短于后", "不确定"], "ansIdx": [2], "explain": "正确答案：C. 前短于后。牢记此考点。", "gid": 125, "explain_pro": "后幅有担干（过肩）的款式，其前后小肩线长「前短于后」（后片肩部需覆盖前肩）。"}, {"type": "single", "label": "单选", "id": 126, "q": "前中装拉链的款式结构中，拉链长（  ）。", "opts": ["要比面布长", "要比面布短", "要与面布相等", "随意，不确定"], "ansIdx": [1], "explain": "正确答案：B. 要比面布短。牢记此考点。", "gid": 126, "explain_pro": "前中装拉链的款式结构中，拉链长「要比面布短」（拉链略短于门襟，露止做法）。"}, {"type": "single", "label": "单选", "id": 127, "q": "AH是指（  ）。", "opts": ["前袖笼长", "后袖笼长", "袖山弧长", "前后袖笼的总周长"], "ansIdx": [3], "explain": "正确答案：D. 前后袖笼的总周长。牢记此考点。", "gid": 127, "explain_pro": "AH 指「前后袖笼的总周长」（Armhole，袖窿弧长）。"}, {"type": "single", "label": "单选", "id": 128, "q": "平时我们对（  ）的调整能有效的控制袖山吃势大小。", "opts": ["袖肥线", "袖山深", "袖斜线", "袖笼"], "ansIdx": [2], "explain": "正确答案：C. 袖斜线。牢记此考点。", "gid": 128, "explain_pro": "袖山容位/吃势考点。袖斜线。袖弦线一定时，袖肥越大袖山越浅、袖肥越小袖山越深；吃势与面料、款式、缝份倒向、肩棉有关。"}, {"type": "single", "label": "单选", "id": 129, "q": "下列哪一种方式能达到最佳的合体袖（  ）。", "opts": ["控制袖山深", "控制袖弦线的倾角", "控制袖肥大", "控制袖笼的大小"], "ansIdx": [1], "explain": "正确答案：B. 控制袖弦线的倾角。牢记此考点。", "gid": 129, "explain_pro": "达到最佳合体袖的方式是「控制袖弦线的倾角」（袖弦线=袖山斜线，倾角决定袖肥与袖山深）。"}, {"type": "single", "label": "单选", "id": 130, "q": "在（  ）条件下，会对袖弦线的长度有影响。", "opts": ["改变袖山深尺寸", "改变袖肥尺寸", "改变袖笼尺寸", "改变袖弦倾角"], "ansIdx": [2], "explain": "正确答案：C. 改变袖笼尺寸。牢记此考点。", "gid": 130, "explain_pro": "「改变袖笼尺寸」会影响袖弦线（袖山斜线）的长度，因袖山深随袖笼变化。"}, {"type": "single", "label": "单选", "id": 131, "q": "人体的和谐比例将意味着服装（  ）可按比例推等得。", "opts": ["胸围", "局部规格", "肩宽", "腰围"], "ansIdx": [1], "explain": "正确答案：B. 局部规格。牢记此考点。", "gid": 131, "explain_pro": "人体和谐比例意味着服装「局部规格」可按比例推等得（比例推档）。"}, {"type": "single", "label": "单选", "id": 132, "q": "从事服装结构设计的工作者有必要对（  ）及其与服装的关系有一个比较全面的了解。", "opts": ["BP点", "人体知识", "面料", "个性"], "ansIdx": [1], "explain": "正确答案：B. 人体知识。牢记此考点。", "gid": 132, "explain_pro": "从事服装结构设计工作者有必要全面了解「人体知识」及其与服装的关系。"}, {"type": "single", "label": "单选", "id": 133, "q": "前腋点是人体（  ）的测量基准点。", "opts": ["背宽", "胸宽", "肩宽", "胸围"], "ansIdx": [1], "explain": "正确答案：B. 胸宽。牢记此考点。", "gid": 133, "explain_pro": "前腋点是人体「胸宽」的测量基准点。"}, {"type": "single", "label": "单选", "id": 134, "q": "一般肩阔而平、肩头略前倾，整个肩膀俯看呈弓形状为（  ）。", "opts": ["男性体", "女性体", "老年体", "幼儿体"], "ansIdx": [0], "explain": "正确答案：A. 男性体。牢记此考点。", "gid": 134, "explain_pro": "肩阔而平、肩头略前倾、整个肩膀俯看呈弓形为「男性体」。"}, {"type": "single", "label": "单选", "id": 135, "q": "从女性与男性体型角度来考虑，裤子后省的大小是（  ）。", "opts": ["男大于女", "女大于男", "男女相等", "不确定"], "ansIdx": [1], "explain": "正确答案：B. 女大于男。牢记此考点。", "gid": 135, "explain_pro": "号型/体型考点。女大于男。GB/T1335.1-97（1998.6.1实施），号=身高、型=净胸围（上装）/净腰围（下装），体型按胸腰差分Y/A/B/C：男A=16~12 ], "explain": "正确答案：D. 胸省。牢记此考点。", "gid": 152, "explain_pro": "特别合体或较合体的女装结构中少不了「胸省」——处理胸部曲面、塑形的核心。"}, {"type": "single", "label": "单选", "id": 153, "q": "女装前幅胸省的建立，必定会给前腰节带来增长（  ）。", "opts": ["0.5 cm", "1.5 cm", "1 cm", "省的大小"], "ansIdx": [0], "explain": "正确答案：A. 0.5 cm。女装前胸省建立会给前腰节带来0.5cm增长。", "gid": 153, "explain_pro": "女装前幅胸省的建立，必定会给前腰节带来增长「0.5cm」（胸省量使前腰节线加长）。"}, {"type": "single", "label": "单选", "id": 154, "q": "服装的任一部位出现由折叠而形成的印痕称（  ）。", "opts": ["褶裥", "褶", "裥", "省"], "ansIdx": [0], "explain": "正确答案：A. 褶裥。牢记此考点。", "gid": 154, "explain_pro": "服装任一部位出现由折叠而形成的印痕称「褶裥」（折叠熨烫定型）。"}, {"type": "single", "label": "单选", "id": 155, "q": "四片无省裙中，臀围的放松量要（  ）。", "opts": ["20cm左右", "40cm左右", "60cm左右", "80cm以上"], "ansIdx": [3], "explain": "正确答案：D. 80cm以上。四片无省裙臀围放松量80cm以上。", "gid": 155, "explain_pro": "四片无省裙中，臀围的放松量要「80cm以上」（无省靠大放松量解决臀腰差）。"}, {"type": "single", "label": "单选", "id": 156, "q": "计算机服装款式设计的主要目标是（  ）构思出新的服装款式。", "opts": ["辅助设计师", "辅助工艺师", "辅助纸样师", "辅助服装企业"], "ansIdx": [0], "explain": "正确答案：A. 辅助设计师。牢记此考点。", "gid": 156, "explain_pro": "计算机服装款式设计的主要目标是「辅助设计师」构思出新款式（CAD是辅助工具，人为主导）。"}, {"type": "single", "label": "单选", "id": 157, "q": "排料时处在布边平行方向的布纹是（  ）。", "opts": ["直纹", "横纹", "斜纹", "平纹"], "ansIdx": [0], "explain": "正确答案：A. 直纹。牢记此考点。", "gid": 157, "explain_pro": "排料时处在布边平行方向的布纹是「直纹」（经向）。"}, {"type": "single", "label": "单选", "id": 158, "q": "排料时处在布边垂直方向的布纹是（  ）。", "opts": ["直纹", "横纹", "斜纹", "平纹"], "ansIdx": [1], "explain": "正确答案：B. 横纹。牢记此考点。", "gid": 158, "explain_pro": "排料时处在布边垂直方向的布纹是「横纹」（纬向）。"}, {"type": "single", "label": "单选", "id": 159, "q": "服装结构中常用到'号'，它是指（  ）。", "opts": ["胸围", "身高", "体重", "体型"], "ansIdx": [1], "explain": "正确答案：B. 身高。牢记此考点。", "gid": 159, "explain_pro": "服装结构中常用到'号'，它是指「身高」。"}, {"type": "single", "label": "单选", "id": 160, "q": "人体的九大生理系统中，与衣的关系最为密切的是（  ）。", "opts": ["消化系统", "感觉系统", "运动系统", "神经系统"], "ansIdx": [2], "explain": "正确答案：C. 运动系统。牢记此考点。", "gid": 160, "explain_pro": "人体九大生理系统中，与衣关系最密切的是「运动系统」（骨骼肌肉决定体型与活动）。"}, {"type": "single", "label": "单选", "id": 161, "q": "（  ）代表腰围。", "opts": ["B", "W", "S", "N"], "ansIdx": [1], "explain": "正确答案：B. W。牢记此考点。", "gid": 161, "explain_pro": "「W」代表腰围（Waist）。"}, {"type": "single", "label": "单选", "id": 162, "q": "（  ）代表肩宽。", "opts": ["B", "W", "S", "N"], "ansIdx": [2], "explain": "正确答案：C. S。牢记此考点。", "gid": 162, "explain_pro": "「S」代表肩宽（Shoulder）。"}, {"type": "single", "label": "单选", "id": 163, "q": "（  ）代表袖长。", "opts": ["SL", "L", "BL", "HL"], "ansIdx": [0], "explain": "正确答案：A. SL。牢记此考点。", "gid": 163, "explain_pro": "「SL」代表袖长（Sleeve Length）。"}, {"type": "single", "label": "单选", "id": 164, "q": "（  ）代表领围。", "opts": ["SL", "TH", "CF", "N"], "ansIdx": [3], "explain": "正确答案：D. N。牢记此考点。", "gid": 164, "explain_pro": "服装制图常用英文字母代号：N=领围(Neck)、B=胸围(Bust)、W=腰围(Waist)、S=肩宽(Shoulder)、SL=袖长(Sleeve Length)。"}, {"type": "single", "label": "单选", "id": 165, "q": "衣身原型的背宽大于胸宽是因为（  ）。", "opts": ["款式的需要", "造型的需要", "人体活动的需要", "比例计算的需要"], "ansIdx": [2], "explain": "正确答案：C. 人体活动的需要。牢记此考点。", "gid": 165, "explain_pro": "衣身原型的背宽大于胸宽是因为「人体活动的需要」（背部活动量大于胸部）。"}, {"type": "single", "label": "单选", "id": 166, "q": "在衣身结构中，侧缝线发生内斜或外斜变化，则邻近的（  ）和底边线应作相应改变。", "opts": ["袖笼线", "肩线", "腰节线", "后背线"], "ansIdx": [0], "explain": "正确答案：A. 袖笼线。牢记此考点。", "gid": 166, "explain_pro": "衣身结构中，侧缝线发生内斜或外斜变化，则邻近的「袖笼线」和底边线应作相应改变。"}, {"type": "single", "label": "单选", "id": 167, "q": "明贴袋西服的大袋袋口位，按哪种方式设定比较合理（  ）。", "opts": ["身高", "扣位", "衣长", "腰节"], "ansIdx": [3], "explain": "正确答案：D. 腰节。牢记此考点。", "gid": 167, "explain_pro": "明贴袋西服的大袋袋口位按「腰节」设定比较合理（与腰节位置协调）。"}, {"type": "single", "label": "单选", "id": 168, "q": "袖子偏前、偏后的调节是在结构图中调节（  ）。", "opts": ["袖山的刀口", "前袖山弧线", "袖山和袖笼的刀口", "后袖山弧线"], "ansIdx": [2], "explain": "正确答案：C. 袖山和袖笼的刀口。牢记此考点。", "gid": 168, "explain_pro": "袖子偏前、偏后的调节是在结构图中调节「袖山和袖笼的刀口」（对位标记调整）。"}, {"type": "single", "label": "单选", "id": 169, "q": "服装设计大师们常把（  ）誉为'女装设计的灵魂'。", "opts": ["公主线", "胸省", "省", "劈门"], "ansIdx": [2], "explain": "正确答案：C. 省。牢记此考点。", "gid": 169, "explain_pro": "服装设计大师常把「省」誉为'女装设计的灵魂'——省是塑造女装曲线的关键手段。"}, {"type": "single", "label": "单选", "id": 170, "q": "体型是由（  ）差值来反映的。", "opts": ["胸围与腰围", "腰围与臀围", "身高与腰围", "身高与胸围"], "ansIdx": [0], "explain": "正确答案：A. 胸围与腰围。牢记此考点。", "gid": 170, "explain_pro": "号型/体型考点。胸围与腰围。GB/T1335.1-97（1998.6.1实施），号=身高、型=净胸围（上装）/净腰围（下装），体型按胸腰差分Y/A/B/C：男A=16~12，Y=22~17，B=11~7，C=6~2；女子各项+2。口诀「男A十六十二，Y加六B减五C再减五，女全加二」。"}, {"type": "single", "label": "单选", "id": 171, "q": "有角度下摆的喇叭裙是以（  ）形式产生的。", "opts": ["任意等分", "二分之一", "三分之一", "四分之一"], "ansIdx": [0], "explain": "正确答案：A. 任意等分。牢记此考点。", "gid": 171, "explain_pro": "有角度下摆的喇叭裙是以「任意等分」形式产生的（等分展开摆量）。"}, {"type": "single", "label": "单选", "id": 172, "q": "宽松腰口收橡筋的款式其前后臀围大小将采用（  ）。", "opts": ["前大后小", "前后一样大", "前小后大", "随意"], "ansIdx": [2], "explain": "正确答案：C. 前小后大。牢记此考点。", "gid": 172, "explain_pro": "宽松腰口收橡筋的款式其前后臀围大小将采用「前小后大」。"}, {"type": "single", "label": "单选", "id": 173, "q": "前幅有三个褶的裤子款式，前后臀围按（  ）安排比较合理。", "opts": ["前大后小", "前后一样大", "前小后大", "随意"], "ansIdx": [0], "explain": "正确答案：A. 前大后小。牢记此考点。", "gid": 173, "explain_pro": "前幅三个褶的裤子，前后臀围按「前大后小」安排（前片多褶需较大臀围）。"}, {"type": "single", "label": "单选", "id": 174, "q": "服装劈门大小与（  ）有关。", "opts": ["体型", "领深", "领开宽", "领型"], "ansIdx": [1], "explain": "正确答案：B. 领深。男式西服劈门2cm，衬衫劈门0（无劈门）。", "gid": 174, "explain_pro": "劈门/搭门考点。领深。男西服劈门2cm、衬衫劈门0、女开门领一般不给劈门；男单排扣搭门2cm、双排扣搭门7cm。"}, {"type": "single", "label": "单选", "id": 175, "q": "原型结构的前后肩斜度是（  ）。", "opts": ["前大后小", "前小后大", "相等", "视体型来决定"], "ansIdx": [0], "explain": "正确答案：A. 前大后小。女性静态肩斜度20°。", "gid": 175, "explain_pro": "原型结构的前后肩斜度是「前大后小」（前肩斜大于后肩斜）。"}, {"type": "single", "label": "单选", "id": 176, "q": "有公主线的合体女装，其前后片胸围的分配为（  ）。", "opts": ["前大后小", "前后相等", "前小后大", "视情况决定"], "ansIdx": [0], "explain": "正确答案：A. 前大后小。牢记此考点。", "gid": 176, "explain_pro": "有公主线的合体女装，其前后片胸围分配为「前大后小」。"}, {"type": "single", "label": "单选", "id": 177, "q": "男式单排扣的搭门宽一般为（  ）。", "opts": ["1cm", "1.5cm", "2cm", "4cm"], "ansIdx": [2], "explain": "正确答案：C. 2cm。男式单排扣搭门2cm，双排扣7cm左右。", "gid": 177, "explain_pro": "劈门/搭门考点。2cm。男西服劈门2cm、衬衫劈门0、女开门领一般不给劈门；男单排扣搭门2cm、双排扣搭门7cm。"}, {"type": "single", "label": "单选", "id": 178, "q": "当领脚宽在0～1cm之间，翻领宽大于领脚宽时属于（  ）。", "opts": ["立领", "坦领", "关门领", "翻驳领"], "ansIdx": [1], "explain": "正确答案：B. 坦领。牢记此考点。", "gid": 178, "explain_pro": "领脚宽 0~1cm、翻领宽大于领脚宽时，属于「坦领」（翻领平摊、几乎无领脚）。"}, {"type": "single", "label": "单选", "id": 179, "q": "当领脚宽大于1cm、翻领宽为0时，属（  ）。", "opts": ["立领", "男衬衫", "关门领", "翻驳领"], "ansIdx": [0], "explain": "正确答案：A. 立领。牢记此考点。", "gid": 179, "explain_pro": "领脚宽大于1cm、翻领宽为0时属「立领」（仅立起无翻领）。"}, {"type": "single", "label": "单选", "id": 180, "q": "单就领围线作几何形态变化的领型是（  ）。", "opts": ["立领", "无领", "圆领", "一字领"], "ansIdx": [1], "explain": "正确答案：B. 无领。牢记此考点。", "gid": 180, "explain_pro": "单就领围线作几何形态变化的领型是「无领」（无领仅靠领围线造型）。"}, {"type": "single", "label": "单选", "id": 181, "q": "对面料进行试测缩水的目的是（  ）。", "opts": ["做到心中有数", "制图缩放缩水量的依据", "成品尺寸的需要", "熨烫工艺的需要"], "ansIdx": [1], "explain": "正确答案：B. 制图缩放缩水量的依据。牢记此考点。", "gid": 181, "explain_pro": "对面料进行试测缩水的目的是「制图缩放缩水量的依据」。"}, {"type": "single", "label": "单选", "id": 182, "q": "男式西服冲肩效果，一般是由（  ）来调节。", "opts": ["横开领", "肩宽", "劈门", "衣架"], "ansIdx": [2], "explain": "正确答案：C. 劈门。牢记此考点。", "gid": 182, "explain_pro": "男西服前片胸部饱满，需在门襟上端做「劈门」（向内偏斜），收掉胸部多余量，使门襟顺直、冲肩自然。这是西服区别于衬衫（衬衫劈门=0）的关键。"}, {"type": "single", "label": "单选", "id": 183, "q": "人体的肩斜度与（  ）有关。", "opts": ["体型", "面料", "肩棉", "工艺"], "ansIdx": [0], "explain": "正确答案：A. 体型。女性静态肩斜度20°。", "gid": 183, "explain_pro": "肩斜度由人体体型决定（女性约20°、男性约19°），随体型胖瘦、溜肩/端肩而变化。面料、肩棉、工艺只能微调，无法改变根本。"}, {"type": "single", "label": "单选", "id": 184, "q": "在宽松的衣身结构中，肩宽和背宽的增大那么（  ）。", "opts": ["胸围必加大", "袖笼深必加深", "横开领必增大", "袖笼深必减小"], "ansIdx": [1], "explain": "正确答案：B. 袖笼深必加深。牢记此考点。", "gid": 184, "explain_pro": "宽松衣身结构中，肩宽和背宽增大则「袖笼深必加深」。"}, {"type": "single", "label": "单选", "id": 185, "q": "当四分之一臀腰差大于7cm时一般选择（  ）。", "opts": ["每片一个省", "每片两个省", "每片三个省", "不收省"], "ansIdx": [1], "explain": "正确答案：B. 每片两个省。1/4臀腰差＞7cm时选每片两个省。", "gid": 185, "explain_pro": "四分之一臀腰差>7cm，说明臀腰差很大（>28cm），单省容量不够，需「每片两个省」分散省量，使侧缝与腰省过渡圆顺。"}, {"type": "single", "label": "单选", "id": 186, "q": "裙子腰省的作用主要体现在（  ）。", "opts": ["解决臀部的凸起", "解决臀腰差", "解决穿着效果", "体型的需要"], "ansIdx": [1], "explain": "正确答案：B. 解决臀腰差。牢记此考点。", "gid": 186, "explain_pro": "裙子腰省的作用主要体现在「解决臀腰差」。"}, {"type": "single", "label": "单选", "id": 187, "q": "制作喇叭裤的臀围一般选择（  ）做法。", "opts": ["宽松的", "合体的", "普通的", "紧身的"], "ansIdx": [1], "explain": "正确答案：B. 合体的。牢记此考点。", "gid": 187, "explain_pro": "喇叭裤臀围需「合体」贴臀，膝盖以下才逐渐放大成喇叭形。若臀围宽松，喇叭造型立不住、失去线条感。"}, {"type": "single", "label": "单选", "id": 188, "q": "斜插袋西裤款式的前后腰口比例一般安排为（  ）。", "opts": ["前-1、后+1", "前+1、后-1", "前±1.5、后±1.5", "前后相等"], "ansIdx": [3], "explain": "正确答案：D. 前后相等。牢记此考点。", "gid": 188, "explain_pro": "斜插袋西裤款式，前后腰口「前后相等」，保持腰线水平平衡。"}, {"type": "single", "label": "单选", "id": 189, "q": "袖笼深加深的量在原型中一定要（  ）胸背所增宽的量。", "opts": ["大于", "小于", "等于", "大于或等于"], "ansIdx": [3], "explain": "正确答案：D. 大于或等于。牢记此考点。", "gid": 189, "explain_pro": "袖笼深加深的量在原型中一定要「大于或等于」胸背所增宽的量。"}, {"type": "single", "label": "单选", "id": 190, "q": "衣身前中拉链露止做法，其拉链长（  ）。", "opts": ["要比面布略长", "要比面布略短", "要与面布等长", "可随意定长度"], "ansIdx": [1], "explain": "正确答案：B. 要比面布略短。牢记此考点。", "gid": 190, "explain_pro": "衣身前中拉链露止做法，其拉链长「要比面布略短」。"}, {"type": "single", "label": "单选", "id": 191, "q": "在袖子结构中对袖子的吃势控制通常控制（  ）。", "opts": ["袖山", "袖肥", "袖斜线", "袖笼"], "ansIdx": [2], "explain": "正确答案：C. 袖斜线。牢记此考点。", "gid": 191, "explain_pro": "袖山容位/吃势考点。袖斜线。袖弦线一定时，袖肥越大袖山越浅、袖肥越小袖山越深；吃势与面料、款式、缝份倒向、肩棉有关。"}, {"type": "single", "label": "单选", "id": 192, "q": "宽松的袖底角通常（  ）度。", "opts": ["大于90", "小于90", "等于90", "任意角"], "ansIdx": [0], "explain": "正确答案：A. 大于90。合体袖底角=90°，宽松袖底角＞90°。", "gid": 192, "explain_pro": "宽松袖（落肩、蝙蝠袖等）袖山低、袖底角变大，「大于90°」，活动量充足、穿着舒适。"}, {"type": "single", "label": "单选", "id": 193, "q": "在一定条件下，为了方便手臂肘部的活动，在结构中可采用（  ）来解决。", "opts": ["增设偏袖", "增大袖弯", "增大袖肥", "增大袖口"], "ansIdx": [1], "explain": "正确答案：B. 增大袖弯。牢记此考点。", "gid": 193, "explain_pro": "为方便手臂肘部活动，结构中可采用「增大袖弯」来解决（袖肘处加大弯曲）。"}, {"type": "single", "label": "单选", "id": 194, "q": "幼童不存在臀腰差，使得幼童裤的腰部一般不（  ）。", "opts": ["归缩", "收省打褶", "加松量", "加调节量"], "ansIdx": [1], "explain": "正确答案：B. 收省打褶。1/4臀腰差＞7cm时选每片两个省。", "gid": 194, "explain_pro": "幼童不存在臀腰差，使幼童裤的腰部一般不「收省打褶」。"}, {"type": "single", "label": "单选", "id": 195, "q": "（  ）的存在是产生西裤前褶和后省的主要原因。", "opts": ["款式", "臀围", "腰围", "臀腰差"], "ansIdx": [3], "explain": "正确答案：D. 臀腰差。牢记此考点。", "gid": 195, "explain_pro": "「臀腰差」的存在是产生西裤前褶和后省的主要原因。"}, {"type": "single", "label": "单选", "id": 196, "q": "荷叶领一般采用（  ）的制图方法。", "opts": ["坦领", "无领", "关门翻驳领", "开门翻驳领"], "ansIdx": [0], "explain": "正确答案：A. 坦领。牢记此考点。", "gid": 196, "explain_pro": "荷叶领一般采用「坦领」的制图方法。"}, {"type": "single", "label": "单选", "id": 197, "q": "唐装立领的领底线要（  ）。", "opts": ["与领圈等长", "比领圈略长", "比领圈略短", "与领圈相切"], "ansIdx": [1], "explain": "正确答案：B. 比领圈略长。牢记此考点。", "gid": 197, "explain_pro": "唐装立领领底线要「比领圈略长」，利用归拔（熨缩）工艺使领子贴合颈部，不起翘、不勒脖。"}, {"type": "single", "label": "单选", "id": 198, "q": "从理论上讲，要使收省后的省尖部位越柔和平服，那省角就（  ）。", "opts": ["越大", "越小", "越长", "越短"], "ansIdx": [1], "explain": "正确答案：B. 越小。牢记此考点。", "gid": 198, "explain_pro": "省道考点。越小。转省必须指向 BP 点（胸高点），收省与开刀结构作用不同。"}, {"type": "single", "label": "单选", "id": 199, "q": "常被作为一种专用的结构形式常用于女装的是（  ）。", "opts": ["胸省", "胸褶", "分割线", "担干线"], "ansIdx": [0], "explain": "正确答案：A. 胸省。牢记此考点。", "gid": 199, "explain_pro": "常被作为专用结构形式常用于女装的是「胸省」。"}, {"type": "single", "label": "单选", "id": 200, "q": "更有推广价值更实用的胸省移位方法是（  ）。", "opts": ["复制旋转一步到位", "几何角度旋转一步到位", "纸样剪开旋转", "折叠展开法"], "ansIdx": [0], "explain": "正确答案：A. 复制旋转一步到位。牢记此考点。", "gid": 200, "explain_pro": "「复制旋转一步到位」用拷贝纸复制省道后整体旋转，省位转移精确、可逆、效率高，是实际生产中最实用、最易推广的方法。"}, {"type": "single", "label": "单选", "id": 201, "q": "在一定的条件下（  ）能达到最佳的合体袖。", "opts": ["控制袖山深", "控制袖斜线的倾角", "控制袖肥大", "控制袖笼的大小"], "ansIdx": [1], "explain": "正确答案：B. 控制袖斜线的倾角。牢记此考点。", "gid": 201, "explain_pro": "在一定的条件下「控制袖斜线的倾角」能达到最佳的合体袖。"}, {"type": "single", "label": "单选", "id": 202, "q": "在一定条件下，改变（  ）会对袖弦线的长度带来影响。", "opts": ["袖山深", "改变袖肥尺寸", "改变袖笼尺寸", "改变袖斜倾角"], "ansIdx": [2], "explain": "正确答案：C. 改变袖笼尺寸。牢记此考点。", "gid": 202, "explain_pro": "袖弦线（袖山斜边）长度由袖山深+袖肥决定，而袖山深又受「袖笼尺寸」制约，故改变袖笼尺寸会直接影响袖弦线长度。"}, {"type": "single", "label": "单选", "id": 203, "q": "臀宽且大于肩宽，后臀外凸明显，呈一定的球面状为（  ）。", "opts": ["男性体", "女性体", "老年体", "幼儿体"], "ansIdx": [1], "explain": "正确答案：B. 女性体。牢记此考点。", "gid": 203, "explain_pro": "臀宽>肩宽、后臀外凸呈球面，是「女性体」的典型特征（女性骨盆宽、脂肪堆积于臀髋部位）。"}, {"type": "single", "label": "单选", "id": 204, "q": "有担干的前后小肩长必（  ）。", "opts": ["前大于后", "后大于前", "前后相等", "任意确定"], "ansIdx": [1], "explain": "正确答案：B. 后大于前。牢记此考点。", "gid": 204, "explain_pro": "有担干的前后小肩长必「后大于前」。"}, {"type": "single", "label": "单选", "id": 205, "q": "男式衬衫的劈门量通常是（  ）厘米。", "opts": ["2", "1", "0.5", "0"], "ansIdx": [3], "explain": "正确答案：D. 0。男式西服劈门2cm，衬衫劈门0（无劈门）。", "gid": 205, "explain_pro": "劈门/搭门考点。0。男西服劈门2cm、衬衫劈门0、女开门领一般不给劈门；男单排扣搭门2cm、双排扣搭门7cm。"}, {"type": "single", "label": "单选", "id": 206, "q": "男式西服的劈门量通常在（  ）厘米左右。", "opts": ["4", "2", "1", "0.5"], "ansIdx": [1], "explain": "正确答案：B. 2。男式西服劈门2cm，衬衫劈门0（无劈门）。", "gid": 206, "explain_pro": "男西服「劈门量」约2cm，用于处理胸部隆起。记忆：男衬衫劈门=0，单排扣搭门2cm、双排扣搭门7cm。"}, {"type": "single", "label": "单选", "id": 207, "q": "可以作为基础样，用来放码的称（  ）。", "opts": ["中码纸样", "小码纸样", "大码纸样", "原码纸样"], "ansIdx": [3], "explain": "正确答案：D. 原码纸样。牢记此考点。", "gid": 207, "explain_pro": "放码以「原码（中间码）纸样」为基准样板，向大码、小码推档，保证各码型比例协调。"}, {"type": "single", "label": "单选", "id": 208, "q": "（  ）与服装CAD系统联结，能达到真正的自动化生产。", "opts": ["CIM", "CAM", "QRS", "FM"], "ansIdx": [1], "explain": "正确答案：B. CAM。牢记此考点。", "gid": 208, "explain_pro": "「CAM」与服装CAD系统联结，能达到真正的自动化生产。"}, {"type": "single", "label": "单选", "id": 209, "q": "当直筒裙子的侧摆缝往外放出，那么脚边即（  ）。", "opts": ["有起翘", "有下落", "有翘高", "水平不变"], "ansIdx": [0], "explain": "正确答案：A. 有起翘。牢记此考点。", "gid": 209, "explain_pro": "直筒裙侧摆向外放，下摆需「起翘」（向上抬），使裙摆边缘保持水平；否则外放后下摆会下垂。"}, {"type": "single", "label": "单选", "id": 210, "q": "松斜度是（  ）结构的核心。", "opts": ["驳口线", "翻驳领", "坦领", "断领脚"], "ansIdx": [1], "explain": "正确答案：B. 翻驳领。牢记此考点。", "gid": 210, "explain_pro": "松斜度（领口线与驳口线的平面夹角）是「翻驳领」结构设计的核心参数，决定翻领的服帖与平摊程度。"}, {"type": "single", "label": "单选", "id": 211, "q": "领基围专用在（  ）结构中。", "opts": ["无领", "立领", "开门领", "翻驳领"], "ansIdx": [3], "explain": "正确答案：D. 翻驳领。牢记此考点。", "gid": 211, "explain_pro": "领基围专用在「翻驳领」结构中（领基圆确定翻驳线）。"}, {"type": "single", "label": "单选", "id": 212, "q": "断领脚的断开线一般（  ）。", "opts": ["取驳口线", "离开驳口线1cm左右", "离开驳口线0.5cm左右", "取领脚的二分之一处"], "ansIdx": [1], "explain": "正确答案：B. 离开驳口线1cm左右。牢记此考点。", "gid": 212, "explain_pro": "断领脚（领座与翻领分断）的断开线一般「离开驳口线1cm左右」，避免缝线压在驳口折痕上。"}, {"type": "single", "label": "单选", "id": 213, "q": "领松斜度主要和（  ）有关联。", "opts": ["翻领与领脚差", "领深", "归拔", "肩斜"], "ansIdx": [0], "explain": "正确答案：A. 翻领与领脚差。牢记此考点。", "gid": 213, "explain_pro": "领松斜度主要与「翻领与领脚差」（翻领宽与领座高的差）有关，差值越大领越松、越可平摊。"}, {"type": "single", "label": "单选", "id": 214, "q": "增大翻领脚的宽度势必会（  ）。", "opts": ["增长翻驳线", "增大横开领", "增大领深", "增大领松斜度"], "ansIdx": [3], "explain": "正确答案：D. 增大领松斜度。牢记此考点。", "gid": 214, "explain_pro": "增大翻领脚的宽度势必会「增大领松斜度」（翻领越宽越外翻松斜）。"}, {"type": "single", "label": "单选", "id": 215, "q": "裙子侧缝开叉，里布的上端须（  ）。", "opts": ["和面布一样长", "比面布加长1cm左右", "比面布加长3cm左右", "比面布减短1cm左右"], "ansIdx": [1], "explain": "正确答案：B. 比面布加长1cm左右。牢记此考点。", "gid": 215, "explain_pro": "裙子侧缝开叉处，里布上端「比面布加长1cm左右」，留出活动余量，防止开叉处里布被撕裂。"}, {"type": "single", "label": "单选", "id": 216, "q": "童装裤一般制作时选择（  ）式。", "opts": ["低腰", "中腰", "高腰", "背带"], "ansIdx": [3], "explain": "正确答案：D. 背带。牢记此考点。", "gid": 216, "explain_pro": "童装裤选「背带式」：儿童腰腹尚在发育、腰围不稳定，背带裤不易滑落、穿着舒适。"}, {"type": "single", "label": "单选", "id": 217, "q": "衣身的纵向剪接线称（  ）。", "opts": ["分割线", "担干线", "公主线", "腰胸省线"], "ansIdx": [2], "explain": "正确答案：C. 公主线。牢记此考点。", "gid": 217, "explain_pro": "衣身的纵向剪接线称「公主线」。"}, {"type": "single", "label": "单选", "id": 218, "q": "在一定的条件下，服装规格的设计往往取决于服装（  ）。", "opts": ["成品尺寸", "放松量", "调节量", "款式"], "ansIdx": [1], "explain": "正确答案：B. 放松量。牢记此考点。", "gid": 218, "explain_pro": "在一定的条件下，服装规格的设计往往取决于服装「放松量」。"}, {"type": "single", "label": "单选", "id": 219, "q": "牛仔裤的腰口一般可按（  ）来安排腰的前后大小的尺寸的分配。", "opts": ["前大后小", "前小后大", "前后一样大", "看情况"], "ansIdx": [0], "explain": "正确答案：A. 前大后小。牢记此考点。", "gid": 219, "explain_pro": "牛仔裤腰口「前大后小」：前腰稍大方便活动，后腰略小贴合腰臀，符合牛仔裤贴身造型。"}, {"type": "single", "label": "单选", "id": 220, "q": "服装结构设计的方法有平面法和（  ）法。", "opts": ["剪接法", "直接", "立体", "间接"], "ansIdx": [2], "explain": "正确答案：C. 立体。牢记此考点。", "gid": 220, "explain_pro": "服装结构设计的方法有平面法和「立体」法。"}, {"type": "single", "label": "单选", "id": 221, "q": "立领是设有（  ）的一类领型。", "opts": ["上级领", "下级领", "领嘴", "领高"], "ansIdx": [0], "explain": "正确答案：A. 上级领。牢记此考点。", "gid": 221, "explain_pro": "立领是领座沿领圈竖立、不翻折的领型，与设有上级领（翻领）的翻驳领相对。本题按题库标准答案记「上级领」。"}, {"type": "single", "label": "单选", "id": 222, "q": "领弯线对（  ）的形态起关键性的作用。", "opts": ["无领", "立领", "坦领", "翻领"], "ansIdx": [1], "explain": "正确答案：B. 立领。牢记此考点。", "gid": 222, "explain_pro": "领弯线对「立领」的形态起关键性的作用。"}, {"type": "single", "label": "单选", "id": 223, "q": "在英制单位中，常用的是（  ）进制。", "opts": ["4", "8", "16", "32"], "ansIdx": [1], "explain": "正确答案：B. 8。英制单位常用8进制。", "gid": 223, "explain_pro": "服装制版英制以「1英寸=8分」为基本分度，常用 1/8、1/4、3/8 等分数，故称「8进制」。"}, {"type": "single", "label": "单选", "id": 224, "q": "一般直筒式男西裤其前后臀围尺寸以（  ）分配。", "opts": ["前大后小", "前小后大", "前后一样大", "看具体情况"], "ansIdx": [0], "explain": "正确答案：A. 前大后小。牢记此考点。", "gid": 224, "explain_pro": "直筒式男西裤前后臀围「前大后小」：前片稍大容纳腹部，后片略小贴合臀部。"}, {"type": "single", "label": "单选", "id": 225, "q": "服装结构设计的出发点和依据是人体的（  ）。", "opts": ["体型特征", "肌肤特征", "体表特征", "净尺寸"], "ansIdx": [2], "explain": "正确答案：C. 体表特征。牢记此考点。", "gid": 225, "explain_pro": "服装结构设计的出发点和依据是人体的「体表特征」（体表起伏与曲面），而非笼统的体型特征或净尺寸。"}, {"type": "single", "label": "单选", "id": 226, "q": "在下列纸样符号中，哪个是车缝拉伸符号（  ）。", "opts": ["锯齿波纹符号", "半圆波纹符号", "三角形向上符号", "半圆弧符号"], "ansIdx": [0], "explain": "正确答案：A. 锯齿波纹符号。牢记此考点。", "gid": 226, "explain_pro": "车缝「拉伸符号」用「锯齿波纹」表示（波浪锯齿形），提示此处缝制时需拉长、抻开布料。"}, {"type": "single", "label": "单选", "id": 227, "q": "在下列纸样符号中，哪个是车缝归拢符号（  ）。", "opts": ["锯齿波纹符号", "半圆波纹符号", "三角形向上符号", "半圆弧符号"], "ansIdx": [1], "explain": "正确答案：B. 半圆波纹符号。牢记此考点。", "gid": 227, "explain_pro": "车缝「归拢符号」用「半圆波纹」表示（半圆弧形），提示此处缝制时需收拢布料。"}, {"type": "single", "label": "单选", "id": 228, "q": "制作（  ）服装时，不能忽略垫肩对肩斜度的影响。", "opts": ["合体", "牛仔", "宽松", "运动"], "ansIdx": [0], "explain": "正确答案：A. 合体。女性静态肩斜度20°。", "gid": 228, "explain_pro": "制作「合体」服装时 短的特点，属地域性体型差异。故正确。"}, {"type": "judge", "label": "判断", "id": 7, "q": "18岁以后，人的身体基本上定型。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 377, "explain_pro": "18 岁后人体骨骼基本定型，体型趋于稳定，这是号型分档以成年人为基准的依据。故正确。"}, {"type": "judge", "label": "判断", "id": 8, "q": "观察和把握体型特征对于服装设计者至关重要。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 378, "explain_pro": "体型特征（高矮胖瘦、胸腰差等）是服装结构设计的基础，把握它至关重要。故正确。"}, {"type": "judge", "label": "判断", "id": 9, "q": "服装规格制定的优劣，很大程度上影响着该国服装工业的发展和技术的交流。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 379, "explain_pro": "规格标准是否合理直接关系到本国服装工业水平与国际技术交流。故正确。"}, {"type": "judge", "label": "判断", "id": 10, "q": "企业标准高于行业标准。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 380, "explain_pro": "标准层级：国家标准最低、行业标准高于国标、企业标准最高。企业标准高于行业标准。故正确。"}, {"type": "judge", "label": "判断", "id": 11, "q": "行业标准高于国家标准。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 381, "explain_pro": "行业标准高于国家标准（企业标准又高于行业标准）。故正确。"}, {"type": "judge", "label": "判断", "id": 12, "q": "七分袖与七分裤是只有七尺长。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。七分袖/裤是\"七分长度\"，不是\"七尺\"。", "gid": 382, "explain_pro": "七分袖/七分裤指长度为全长的七成（约7/10），不是'七尺长'。故本题说法「错误」。"}, {"type": "judge", "label": "判断", "id": 13, "q": "合体服装的流线处理，应是人体曲线的表现。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 383, "explain_pro": "合体服装的流线处理应贴合人体曲线，是人体曲线的表现。故本题说法「正确」。"}, {"type": "judge", "label": "判断", "id": 14, "q": "设计服装尺寸，就是衣服在人体外的放松量形成的理想形态的设计。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 384, "explain_pro": "服装尺寸设计本质是设计人体外的放松量，形成理想廓形。故正确。"}, {"type": "judge", "label": "判断", "id": 15, "q": "在5.3A号型系列表中，每一腰围对应着三个胸围尺寸。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。5.3A系列中每一腰围对应的胸围不止三档。", "gid": 385, "explain_pro": "5.3A号型系列中，身高按5cm、胸围按3cm分档；同一胸围按体型对应不同腰围，而非'每一腰围对应三个胸围'。故「错误」。"}, {"type": "judge", "label": "判断", "id": 16, "q": "男女最显著的骨骼差异是胸廓。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。男女最显著骨骼差异是骨盆，不是胸廓。", "gid": 386, "explain_pro": "男女最显著的骨骼差异是「骨盆」（女性骨盆宽而浅），不是胸廓。故「错误」。"}, {"type": "judge", "label": "判断", "id": 17, "q": "我国的服装国家标准中，设有背长尺寸。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。国标中没有背长尺寸。", "gid": 387, "explain_pro": "我国服装国家标准（号型GB/T1335）未设「背长」尺寸（背长属控制部位，不列入号型系列）。故「错误」。"}, {"type": "judge", "label": "判断", "id": 18, "q": "当人体自然直立时，手臂呈垂直直线状态。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。自然直立时手臂有弧度，不是垂直直线。", "gid": 388, "explain_pro": "人体自然直立时，手臂自然下垂略向前倾、呈自然弯曲，不是垂直直线。故错误。"}, {"type": "judge", "label": "判断", "id": 19, "q": "编写服装成品尺寸表就是一项精确的测量记录性的工作。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。编写尺寸表是设计性工作，不是简单测量记录。", "gid": 389, "explain_pro": "编写成品尺寸表不是单纯的测量记录，而是结合款式、加放量的设计工作。故「错误」。"}, {"type": "judge", "label": "判断", "id": 20, "q": "我国的服装国家标准中，设有股上长尺寸。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 390, "explain_pro": "我国服装号型国家标准中设有「股上长」尺寸。故正确。"}, {"type": "judge", "label": "判断", "id": 21, "q": "服装成品尺寸的编写无需任何依据，只需经验数据。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。尺寸编写需依据号型标准/人体数据，不能只凭经验。", "gid": 391, "explain_pro": "成品尺寸编制必须依据号型标准、人体数据、放松量，不能仅凭经验。故错误。"}, {"type": "judge", "label": "判断", "id": 22, "q": "鱼尾裙的尺寸结构上部成合体状，在裙摆部尺寸加大，即能成为鱼尾状。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 392, "explain_pro": "鱼尾裙上部合体、裙摆加大即呈鱼尾状。故正确。"}, {"type": "judge", "label": "判断", "id": 23, "q": "大鱼尾裙与小鱼尾裙的区别是在开始张开的部位高低来定。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 393, "explain_pro": "大鱼尾裙与小鱼尾裙的区别，在于裙摆开始张开的部位高低不同（大鱼尾张开点高、小鱼尾低）。故「正确」。"}, {"type": "judge", "label": "判断", "id": 24, "q": "裁剪分床方案应尽可能节约人力、物力及材力和时间，减少重复劳动。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 394, "explain_pro": "裁剪分床方案应尽可能节约人力、物力、材力和时间，减少重复劳动。故「正确」。"}, {"type": "judge", "label": "判断", "id": 25, "q": "对高档及特殊材料的面辅料在裁床分配方案时尽量套裁，加长辅料长度。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 395, "explain_pro": "高档特殊面辅料在裁床分配时尽量套裁、加长辅料长度以省料。故正确。"}, {"type": "judge", "label": "判断", "id": 26, "q": "裁床生产工艺是服装生产企业第一步的实现生产加工过程。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 396, "explain_pro": "裁床生产是服装生产加工的第一道工序。故正确。"}, {"type": "judge", "label": "判断", "id": 27, "q": "男款生活装的袖山一般不溶缩泡起。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 397, "explain_pro": "男款生活装（日常休闲）袖山一般不溶缩泡起，保持平整。故正确。"}, {"type": "judge", "label": "判断", "id": 28, "q": "男式衬衣的后背褶量能加肥整体胸围的松量。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 398, "explain_pro": "男式衬衫后背褶（背褶）量能加大胸围松量。故正确。"}, {"type": "judge", "label": "判断", "id": 29, "q": "西裤是男装最基础而且是最重要的服装构成形式。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 399, "explain_pro": "西裤是男装最基础、最重要的服装构成形式。故「正确」。"}, {"type": "judge", "label": "判断", "id": 30, "q": "衣长尺寸在胯部以上的服装称短装。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 400, "explain_pro": "衣长在胯部以上称短装。故正确。"}, {"type": "judge", "label": "判断", "id": 31, "q": "在膝以上臀以下的长度称中长上装。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 401, "explain_pro": "长度在膝上臀下称中长上装。故正确。"}, {"type": "judge", "label": "判断", "id": 32, "q": "大衣的尺寸长度是在小腿中部以下。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。大衣长度在膝上至小腿上段，不在小腿中部以下。", "gid": 402, "explain_pro": "大衣长度应在小腿中部以下（更长），题述错误。故错误。"}, {"type": "judge", "label": "判断", "id": 33, "q": "西裙的特点是三片式，有拉链、后开衩上腰的式样。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 403, "explain_pro": "西裙特点：三片式、有拉链、后开衩、上腰。故正确。"}, {"type": "judge", "label": "判断", "id": 34, "q": "服装CAD中也可通过人、机交互式排版。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 404, "explain_pro": "服装 CAD 支持人机交互式排版。故正确。"}, {"type": "judge", "label": "判断", "id": 35, "q": "结构设计在服装设计中起着承上启下的作用。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 405, "explain_pro": "结构设计在服装设计中起承上启下作用（连接款式设计与工艺设计）。故正确。"}, {"type": "judge", "label": "判断", "id": 36, "q": "实际上男女衣身的基础纸样可通用。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。男女衣身基础纸样不能通用（体型差异大）。", "gid": 406, "explain_pro": "男女衣身基础纸样因胸腰差、体型不同，不可通用。故错误。"}, {"type": "judge", "label": "判断", "id": 37, "q": "制作样板的时候可以不加工原料的缩率和缝缩率。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。做样板必须加原料缩率和缝缩率。", "gid": 407, "explain_pro": "制作样板必须考虑原料缩率和缝缩率，否则成品尺寸不准。故错误。"}, {"type": "judge", "label": "判断", "id": 38, "q": "没后开衩的裙子就不能称为西裙。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。西裙不一定有后开衩。", "gid": 408, "explain_pro": "没有后开衩的裙子也可以称为西裙（西裙核心是合体直筒+省道，开衩非必备）。故「错误」。"}, {"type": "judge", "label": "判断", "id": 39, "q": "口袋是服装中点、面和体的附属性设计。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 409, "explain_pro": "口袋是服装点、面、体的附属性设计。故正确。"}, {"type": "judge", "label": "判断", "id": 40, "q": "在批量生产前必须进行样衣的制作、试样和修正。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 410, "explain_pro": "批量生产前必须样衣制作、试样、修正。故正确。"}, {"type": "judge", "label": "判断", "id": 41, "q": "服装纸样结构设计，是实现工艺流程的根本。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。结构设计是纸样设计的基础，不是工艺流程。", "gid": 411, "explain_pro": "实现工艺流程的根本是工艺设计与设备，纸样结构设计是其基础而非'根本'。故「错误」。"}, {"type": "judge", "label": "判断", "id": 42, "q": "童装裤可视流行趋势带制成低腰款式。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。童装裤不宜做低腰（考虑儿童发育）。", "gid": 412, "explain_pro": "童装裤不应随意追流行做成低腰，要考虑儿童生长发育。故错误。"}, {"type": "judge", "label": "判断", "id": 43, "q": "纸样尺寸等于成品所要求的尺寸。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。纸样尺寸≠成品尺寸，要加缝份/缩率。", "gid": 413, "explain_pro": "纸样尺寸 = 成品尺寸 + 调节量（缩率等），不等于成品尺寸。故错误。"}, {"type": "judge", "label": "判断", "id": 44, "q": "褶款中可作移省处理的新的省位线必须指向省尖。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。移省新省位线指向省尖，不是必须。", "gid": 414, "explain_pro": "褶款中移省处理的新省位线不必指向省尖（活褶/碎褶可平行分布、不指向BP点）。故「错误」。"}, {"type": "judge", "label": "判断", "id": 45, "q": "一个腰省合并展开两个新的省位，该两个新的省尖都要指向原省尖。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。两新省尖不必都指向原省尖。", "gid": 415, "explain_pro": "一个腰省展开两个新省，两个新省尖都应指向原省尖（BP）。题述正确。"}, {"type": "judge", "label": "判断", "id": 46, "q": "高腰裙纸样的侧缝也存在超高的基本量。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。高腰裙侧缝没有超高基本量。", "gid": 416, "explain_pro": "高腰裙侧缝并不存在固定的'超高基本量'，起翘量随腰线抬高和造型而定。故「错误」。"}, {"type": "judge", "label": "判断", "id": 47, "q": "前衣片的经向要以门襟中心线为准，不允许倾斜。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 417, "explain_pro": "前衣片经向以门襟中心线为准，不允许倾斜。故正确。"}, {"type": "judge", "label": "判断", "id": 48, "q": "收省与开刀的作用在结构上是不同的。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 418, "explain_pro": "收省（消除浮余量）与开刀（分割线兼具造型）结构作用不同。故正确。"}, {"type": "judge", "label": "判断", "id": 49, "q": "裤片的形发生了变化，裤的造型同时也发生了变化。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 419, "explain_pro": "裤片形状变化会引起裤造型变化。故正确。"}, {"type": "judge", "label": "判断", "id": 50, "q": "前裤片的褶量决定着臀围的松量。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 420, "explain_pro": "前裤片的褶量决定臀围的松量（褶大则臀围松量足）。故「正确」。"}, {"type": "judge", "label": "判断", "id": 51, "q": "中山装其实也是西装的一种变异服装造型。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 421, "explain_pro": "中山装由西装变异而来（立领+四袋+门襟），属西装变异造型。故正确。"}, {"type": "judge", "label": "判断", "id": 52, "q": "服装推板放码的过程实际上也是制板的过程。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 422, "explain_pro": "推板放码本质是制板过程。故正确。"}, {"type": "judge", "label": "判断", "id": 53, "q": "刀口大小不能超过0.2cm深不能超过0.3cm。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 423, "explain_pro": "刀口（剪口）大小不超过 0.2cm、深不超过 0.3cm。故正确。"}, {"type": "judge", "label": "判断", "id": 54, "q": "裤子后裆和斜势是完全按照腰围加省量之后的余量来劈掉的。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。后裆斜势不止按余量劈，还要考虑臀凸。", "gid": 424, "explain_pro": "裤子后裆斜势由臀腰差等因素综合决定，不是完全按腰围加省量后余量劈掉。故错误。"}, {"type": "judge", "label": "判断", "id": 55, "q": "衣身原型是人体的基本型。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。衣身原型是基准型，不是人体基本型。", "gid": 425, "explain_pro": "衣身原型不是人体的基本型（原型是含放松量的服装基础纸样，人体基本型是净体）。故错误。"}, {"type": "judge", "label": "判断", "id": 56, "q": "衣身原型尺寸中是不包含胸围的基本放松量。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。衣身原型包含基本放松量。", "gid": 426, "explain_pro": "衣身原型尺寸中包含胸围基本放松量（约 10cm）。故错误。"}, {"type": "judge", "label": "判断", "id": 57, "q": "上装的里布在休闲款式中不用做成风琴位形式。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。休闲款上装里布不用做风琴位。", "gid": 427, "explain_pro": "上装里布在休闲款式中也要做风琴位（后中活褶）以保证活动量。故错误。"}, {"type": "judge", "label": "判断", "id": 58, "q": "有胸省的女装原型前、后上平线总是在同一水平线上。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。有胸省女装原型前后上平线不在同一水平线（前长）。", "gid": 428, "explain_pro": "有胸省女装原型，前后上平线不在同一水平线（前片因胸省而下落）。故错误。"}, {"type": "judge", "label": "判断", "id": 59, "q": "女式有胸省原型的前胸宽与后背宽是相等的。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。女装前胸宽≠后背宽（背宽＞胸宽）。", "gid": 429, "explain_pro": "女式有胸省原型前胸宽与后背宽不相等。故错误。"}, {"type": "judge", "label": "判断", "id": 60, "q": "一般情况下，前肩斜度总小于后肩斜度。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。前肩斜度＞后肩斜度（题说\"前小于后\"错）。", "gid": 430, "explain_pro": "一般前肩斜度大于后肩斜度（人体前肩更斜）。故错误。"}, {"type": "judge", "label": "判断", "id": 61, "q": "依赖于衣身原型作出的衣袖称之为联身袖。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。联身袖不是依赖衣身原型做的袖。", "gid": 431, "explain_pro": "联身袖（连裁袖）是衣身与袖连成一体裁剪，不是'依赖衣身原型作出'的袖。故「错误」。"}, {"type": "judge", "label": "判断", "id": 62, "q": "合体春秋上装的袖肥控制在0.2B+2cm。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。合体春秋上装袖肥不是0.2B+2cm。", "gid": 432, "explain_pro": "合体春秋上装的袖肥约为 0.2B-2 左右（需减量），0.2B+2cm 偏宽松，不属合体。故「错误」。"}, {"type": "judge", "label": "判断", "id": 63, "q": "女装开门领一般不给劈门，因为劈门同时也会增长驳口线。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 433, "explain_pro": "女装开门领一般不给劈门，因劈门会增长驳口线。故正确。"}, {"type": "judge", "label": "判断", "id": 64, "q": "宽松款式的肩宽一定要比一般款式加宽些。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。宽松款肩宽不一定加宽。", "gid": 434, "explain_pro": "宽松款式可通过落肩、连袖等手法处理，肩宽不一定比一般款式加宽。故「错误」。"}, {"type": "judge", "label": "判断", "id": 65, "q": "袖笼深越加深其袖笼底部夹角就越大于90°。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 435, "explain_pro": "袖笼深越加深，袖笼底部夹角就越大于90°（底部趋于平缓）。故「正确」。"}, {"type": "judge", "label": "判断", "id": 66, "q": "男式西服一般都是采用三开身做法。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 436, "explain_pro": "男式西服采用三开身（前片+后片+侧片）做法。故正确。"}, {"type": "judge", "label": "判断", "id": 67, "q": "臂腰差只能由收省来解决。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。臂腰差不只能由收省解决。", "gid": 437, "explain_pro": "臂腰差（臀腰差）不仅靠收省解决，还可用褶、分割等。故错误。"}, {"type": "judge", "label": "判断", "id": 68, "q": "胸省作为一种专用的结构形式而常用于男装。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。胸省是女装专用结构，非男装。", "gid": 438, "explain_pro": "胸省常用于女装（处理胸部曲面），男装少用。故错误。"}, {"type": "judge", "label": "判断", "id": 69, "q": "垫肩的抬高肩端量，视款式宽松的程度来定。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。垫肩抬高肩端量由肩斜度定，非款式宽松度。", "gid": 439, "explain_pro": "垫肩抬高肩端量视肩型与款式造型需求而定，并非按'宽松程度'来定。故「错误」。"}, {"type": "judge", "label": "判断", "id": 70, "q": "一般袖长尺寸都是包含袖克夫高度的。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 440, "explain_pro": "一般袖长尺寸包含袖克夫（袖头）高度。故正确。"}, {"type": "judge", "label": "判断", "id": 71, "q": "罗纹有良好的弹性，多用于各类内衣及外衣的下摆、袖口、领口等。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 441, "explain_pro": "罗纹弹性好，多用于内衣外衣的下摆、袖口、领口。故正确。"}, {"type": "judge", "label": "判断", "id": 72, "q": "高档男式西裤都是折好脚边销售的。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。高档男西裤不折脚边销售。", "gid": 442, "explain_pro": "高档男式西裤一般不折脚边（保持裤脚悬垂感），折脚边是休闲裤做法。故错误。"}, {"type": "judge", "label": "判断", "id": 73, "q": "海军领可制作成断领脚。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。海军领不能做成断领脚。", "gid": 443, "explain_pro": "海军领（水手领）是翻领型，不可制作成断领脚（断领脚是翻驳领结构）。故「错误」。"}, {"type": "judge", "label": "判断", "id": 74, "q": "衬衫反门襟3.5cm宽，即搭门宽为3.5cm。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。反门襟3.5cm宽≠搭门3.5cm。", "gid": 444, "explain_pro": "衬衫反门襟 3.5cm 宽不等于搭门宽 3.5cm（搭门宽指扣位至门襟止口距离）。故错误。"}, {"type": "judge", "label": "判断", "id": 75, "q": "典型男式西服都是三开身的结构。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 445, "explain_pro": "典型男式西服是三开身结构。故正确。"}, {"type": "judge", "label": "判断", "id": 76, "q": "控制袖弦线长度的尺寸也就能控制袖山容位的大小。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 446, "explain_pro": "控制袖弦线长度即控制袖山容位大小。故正确。"}, {"type": "judge", "label": "判断", "id": 77, "q": "男式西服双排扣搭门一般可设在7cm左右。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 447, "explain_pro": "男式西服双排扣搭门一般 7cm 左右。故正确。"}, {"type": "judge", "label": "判断", "id": 78, "q": "男式西服袖没有后偏袖量。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。西服袖有后偏袖量。", "gid": 448, "explain_pro": "男式西服袖有后偏袖量。故错误。"}, {"type": "judge", "label": "判断", "id": 79, "q": "女式原型结构前、后的上平线都在同一水平线上。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。女装原型前后上平线不在同一水平线。", "gid": 449, "explain_pro": "女式原型结构前后上平线不在同一水平线（前下落）。故错误。"}, {"type": "judge", "label": "判断", "id": 80, "q": "人的胖瘦与胸省的大小无直接的关系。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 450, "explain_pro": "人的胖瘦与胸省大小无直接关系（胸省由胸腰差/胸部造型决定，与胖瘦无必然关联）。故「正确」。"}, {"type": "judge", "label": "判断", "id": 81, "q": "为了使领口服贴，女装开门领一般都劈门。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。女装开门领一般不劈门。", "gid": 451, "explain_pro": "女装开门领一般不劈门（劈门主要用于男西服等），为使领口服贴通常靠归拔处理。故「错误」。"}, {"type": "judge", "label": "判断", "id": 82, "q": "当我们在裁剪服装时，应注意光、色、格的变化，以保证服装的完整性。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 452, "explain_pro": "裁剪时注意光、色、格（对条对格）变化，保证服装完整性。故正确。"}, {"type": "judge", "label": "判断", "id": 83, "q": "开尾拉链主要用于前襟全开的服装和可装卸衣里的服装。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 453, "explain_pro": "开尾拉链用于前襟全开和可装卸衣里的服装。故正确。"}, {"type": "judge", "label": "判断", "id": 84, "q": "粘合衬的质量对服装的质量与使用价值毫无关系。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。粘合衬质量对服装质量有重要影响。", "gid": 454, "explain_pro": "粘合衬质量直接影响服装质量与使用价值（脱胶、起泡）。故错误。"}, {"type": "judge", "label": "判断", "id": 85, "q": "男式西服的劈门也只是为了解决冲肩效果。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。西服劈门不止解决冲肩，还有领口服贴。", "gid": 455, "explain_pro": "男式西服劈门除解决冲肩外还有造型等多重作用。故错误。"}, {"type": "judge", "label": "判断", "id": 86, "q": "一个裙子腰省可以合并展开两个侧省。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 456, "explain_pro": "一个裙子腰省可合并展开两个侧省。故正确。"}, {"type": "judge", "label": "判断", "id": 87, "q": "纸样尺寸就是成品尺寸加上各部位的纸样调节量。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 457, "explain_pro": "纸样尺寸 = 成品尺寸 + 各部位调节量。故正确。"}, {"type": "judge", "label": "判断", "id": 88, "q": "童装裤只适合做成收橡筋的款式。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。童装裤不只做收橡筋。", "gid": 458, "explain_pro": "童装裤不仅适合收橡筋，还可做背带裤、松紧+腰带等多种款式。故「错误」。"}, {"type": "judge", "label": "判断", "id": 89, "q": "西裤的后裆斜势一般可控制在15:0~15:4之间。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。西裤后裆斜势控制范围表述有误。", "gid": 459, "explain_pro": "西裤后裆斜势一般控制在 15:2.5~15:4 左右，15:0（无斜势）不符合。故「错误」。"}, {"type": "judge", "label": "判断", "id": 90, "q": "青果领可以制作成联身青果领。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 460, "explain_pro": "青果领可制作成联身青果领（领与驳头连成一体）。故正确。"}, {"type": "judge", "label": "判断", "id": 91, "q": "服装CAD即计算机辅助服装设计系统。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 461, "explain_pro": "服装 CAD 即计算机辅助服装设计系统。故正确。"}, {"type": "judge", "label": "判断", "id": 92, "q": "一般多用作内衣的多是双罗纹针织物。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 462, "explain_pro": "双罗纹针织物（棉毛布）多用作内衣。故正确。"}, {"type": "judge", "label": "判断", "id": 93, "q": "针织物的长度一种是定重方式；另一种是定长方式。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 463, "explain_pro": "针织物长度计量有定重方式（定量）和定长方式两种。故正确。"}, {"type": "judge", "label": "判断", "id": 94, "q": "织物丝缕在纺织生产加工中一般不会有收缩变形，不必矫正布纹。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。织物丝缕会收缩变形，需矫正布纹。", "gid": 464, "explain_pro": "织物丝缕在生产加工中会收缩变形，需矫正布纹（经纬纱垂直）。故错误。"}, {"type": "judge", "label": "判断", "id": 95, "q": "一般条件下前肩斜度都会大于后肩斜度。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 465, "explain_pro": "一般前肩斜度大于后肩斜度。故正确。"}, {"type": "judge", "label": "判断", "id": 96, "q": "衣身上的纵向剪接线称公主线。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 466, "explain_pro": "衣身上纵向剪接线称公主线。故正确。"}, {"type": "judge", "label": "判断", "id": 97, "q": "无袖款式的上装里布就无需做后中风琴位。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 467, "explain_pro": "无袖款上装里布无需做后中风琴位（无袖窿活动需求）。故正确。"}, {"type": "judge", "label": "判断", "id": 98, "q": "前后裆脚的差量是可以适当调节的。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 468, "explain_pro": "前后裆脚差量可适当调节。故正确。"}, {"type": "judge", "label": "判断", "id": 99, "q": "指向BP点的线段才能转省。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。不止指向BP点的线段才能转省。", "gid": 469, "explain_pro": "只有指向 BP 点（胸高点）的线段才能转省。故错误。"}, {"type": "judge", "label": "判断", "id": 100, "q": "宽松结构的袖笼底角必大于90度。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 470, "explain_pro": "宽松结构的袖笼底角必大于90°（袖笼底平缓、活动量大）。故「正确」。"}, {"type": "judge", "label": "判断", "id": 101, "q": , "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。有背褶男衬衫胸围分配前小后大（非前大后小）。", "gid": 480, "explain_pro": "有背褶男式衬衫胸围应前小后大（后背褶量在后）。故错误。"}, {"type": "judge", "label": "判断", "id": 111, "q": "里布毛样比面布的毛样短3cm，制作成死里的成品里布比面布短2.5cm。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。里布毛样短3cm/死里短2.5cm表述有误。", "gid": 481, "explain_pro": "里布毛样比面布毛样长（不是短）约 3cm 以便做松量。故错误。"}, {"type": "judge", "label": "判断", "id": 112, "q": "男式衬衫领除了独立的制作方法外，还能采用坦领那样在领圈上制图设计。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。男衬衫领不能按坦领制图设计。", "gid": 482, "explain_pro": "男式衬衫领必须采用独立的制作方法（领座+翻领分离制图），不能像坦领那样直接在领圈上制图。故本题说法「错误」。"}, {"type": "judge", "label": "判断", "id": 113, "q": "服装CAD样片结构设计系统是设计师利用计算机进行结构设计和制作工业样板的工具。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 483, "explain_pro": "服装 CAD 样片结构设计系统是设计师进行结构设计和制作工业样板的工具。故正确。"}, {"type": "judge", "label": "判断", "id": 114, "q": "成品袖子要达到圆润、饱满的效果实质最重要的是袖山的深浅。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。袖子圆润饱满关键是袖山弧线与袖笼匹配，非袖山深浅。", "gid": 484, "explain_pro": "袖子圆润饱满关键在袖山容位（吃势）的合理分布，不是单纯袖山深浅。故错误。"}, {"type": "judge", "label": "判断", "id": 115, "q": "男式双排扣的搭门一般是5cm。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。男双排扣搭门约7cm，不是5cm。", "gid": 485, "explain_pro": "男式双排扣搭门一般 7cm，不是 5cm。故本题说法「错误」。"}, {"type": "judge", "label": "判断", "id": 116, "q": "袖笼深越加深则下段袖笼弧线弯势越大。", "opts": ["正确", "错误"], "ansIdx": [1], "explain": "本题答案：错误 ✗。袖笼深加深，下段袖笼弧线弯势变小。", "gid": 486, "explain_pro": "袖窿深加深，下段袖窿弧线弯势变小（更直），不是越大。故错误。"}, {"type": "judge", "label": "判断", "id": 117, "q": "折叠车缝排的部分称之为省。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 487, "explain_pro": "折叠车缝的部分称省。故正确。"}, {"type": "judge", "label": "判断", "id": 118, "q": "纸样是服装结构制图的规范化、标准化、科学化与系列化的必然结果。", "opts": ["正确", "错误"], "ansIdx": [0], "explain": "本题答案：正确 ✓。此题表述正确，牢记此知识点。", "gid": 488, "explain_pro": "纸样是结构制图规范化、标准化、科学化、系列化的结果。故正确。"}, {"type": "judge", "label": "判断", "id": 119, "q": "人体的体形特征是进行服装结构 const STORE = 'fzbs_wrong_only_v1';
const TOTAL = CARDS.length;

// state = { wrong: {gid: count}, done: {gid: 1} }
let state = loadState();
let mode = 'practice';

function loadState(){
  let s = { wrong:{}, done:{} };
  try{ s = JSON.parse(localStorage.getItem(STORE)) || s; }catch(e){}
  if(!s.wrong) s.wrong = {}; if(!s.done) s.done = {};
  // 自动迁移旧系统错题
  let migrated = {};
  try{ migrated = JSON.parse(localStorage.getItem('fzbs_wrong_migrated_v1')) || {}; }catch(e){}
  let changed = false;
  function merge(oldKey){
    try{
      const old = JSON.parse(localStorage.getItem(oldKey)) || {};
      Object.keys(old).forEach(gid => {
        if(migrated[gid]) return;
        const st = old[gid];
        if(st && st.answered){
          if(!st.correct){ s.wrong[gid] = st.wrongCount || 1; changed = true; }
          else { s.done[gid] = 1; changed = true; }
        }
      });
    }catch(e){}
  }
  merge('fzbs_wrong_practice_v1');
  merge('fzbs_card_v1');
  if(changed){
    try{ localStorage.setItem(STORE, JSON.stringify(s)); }catch(e){}
  }
  return s;
}
function saveState(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }

function getCard(gid){ return CARDS.find(c => c.gid === gid); }
function correctLabel(c){
  if(c.type === 'judge') return c.ansIdx[0] === 0 ? '正确' : '错误';
  return c.ansIdx.map(i => String.fromCharCode(65+i)).join('、');
}

function wrongCount(){ return Object.keys(state.wrong).length; }

function setMode(m){
  mode = m;
  document.getElementById('tabPractice').className = 'tab' + (m==='practice'?' practice-active':'');
  document.getElementById('tabWrong').className = 'tab' + (m==='wrong'?' wrong-active':'');
  render();
}

function render(){
  document.getElementById('wrongNum').textContent = wrongCount();
  const list = document.getElementById('list');

  if(mode === 'wrong'){
    const gids = Object.keys(state.wrong).map(Number).sort((a,b)=>a-b);
    document.getElementById('subLbl').textContent = gids.length ? '答对移出错题本' : '错题本空啦 🎉';
    if(gids.length === 0){
      list.innerHTML = '<div class="empty"><span class="big">🏆</span>错题本空啦！<div class="hint">点上面「🆕 刷题攒错题」先刷题<br>答错的会自动进错题本</div></div>';
      return;
    }
    list.innerHTML = gids.map(gid => renderCard(getCard(gid))).join('');
    return;
  }

  // practice 模式：显示未完成（未答对）的题
  const todo = CARDS.filter(c => !state.done[c.gid]);
  document.getElementById('subLbl').textContent = '还剩 ' + todo.length + ' 题 · 答对跳过，答错进错题本';
  if(todo.length === 0){
    list.innerHTML = '<div class="empty"><span class="big">🎉</span>全部刷完了！<div class="hint">答错的题都在「🔴 错题重练」里</div></div>';
    return;
  }
  list.innerHTML = todo.map(c => renderCard(c)).join('');
}

function renderCard(c){
  const gid = c.gid;
  const isMulti = c.type === 'multi';
  const wrongTimes = state.wrong[gid] || 0;
  const optsHtml = c.opts.map((o,i)=>{
    const letter = String.fromCharCode(65+i);
    return '<div class="opt'+(isMulti?' multi':'')+'" onclick="toggleOpt('+gid+','+i+')">'+
      '<div class="box">'+letter+'</div><div>'+letter+'. '+o+'</div></div>';
  }).join('');
  return '<div class="card" data-gid="'+gid+'">'+
    '<div><span class="tag '+c.type+'">'+c.label+'</span>'+
    '<span class="no">第 '+gid+' 题'+(wrongTimes>0?' · 已错 '+wrongTimes+' 次':'')+'</span></div>'+
    '<div class="q">'+c.q+'</div>'+optsHtml+
    '<div class="feedback" id="fb'+gid+'"></div>'+
  '</div>';
}

function toggleOpt(gid, idx){
  const c = getCard(gid);
  const cardEl = document.querySelector('.card[data-gid="'+gid+'"]');
  if(!cardEl) return;
  const isMulti = c.type === 'multi';
  const optEl = cardEl.querySelectorAll('.opt')[idx];
  if(isMulti){
    optEl.classList.toggle('sel');
    const selected = cardEl.querySelectorAll('.opt.sel');
    if(selected.length >= c.ansIdx.length) judge(gid, c, cardEl);
    return;
  }
  cardEl.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
  optEl.classList.add('sel');
  judge(gid, c, cardEl);
}

function judge(gid, c, cardEl){
  const isMulti = c.type === 'multi';
  let selectedIdx = [];
  if(isMulti){
    cardEl.querySelectorAll('.opt.sel').forEach(o=>{
      selectedIdx.push(Array.from(cardEl.querySelectorAll('.opt')).indexOf(o));
    });
  } else {
    const sel = cardEl.querySelector('.opt.sel');
    if(!sel) return;
    selectedIdx = [Array.from(cardEl.querySelectorAll('.opt')).indexOf(sel)];
  }
  const userSet = selectedIdx.slice().sort().join(',');
  const correctSet = c.ansIdx.slice().sort().join(',');
  const isCorrect = userSet === correctSet;

  cardEl.querySelectorAll('.opt').forEach((o, i)=>{
    o.style.pointerEvents = 'none';
    if(c.ansIdx.includes(i)) o.classList.add('correct');
    else if(selectedIdx.includes(i)) o.classList.add('wrong');
    if(c.ansIdx.includes(i) && !selectedIdx.includes(i)) o.classList.add('miss');
  });

  const fb = cardEl.querySelector('.feedback');
  if(isCorrect){
    fb.className = 'feedback show ok';
    fb.innerHTML = '✅ 答对了！' + (mode==='wrong' ? '已移出错题本' : '') +
      '<div class="explain">💡 '+c.explain_pro+'</div>';
    // 答对：从错题本移除，标记已完成
    delete state.wrong[gid];
    state.done[gid] = 1;
    saveState();
    if(mode === 'wrong'){
      toast('✅ 答对，已移出错题本');
      setTimeout(()=>{ cardEl.style.opacity='0'; cardEl.style.transition='.3s'; setTimeout(render, 300); }, 700);
    } else {
      // 刷题模式：停留展示解析，加"下一题"
      fb.innerHTML += '<div style="margin-top:8px"><button class="btn btn-accent" onclick="render()">下一题 →</button></div>';
    }
  } else {
    fb.className = 'feedback show no';
    fb.innerHTML = '❌ 答错了 <b class="ans">正确答案：'+correctLabel(c)+'</b>'+
      '<div class="explain">💡 '+c.explain_pro+'</div>';
    // 答错：进错题本
    state.wrong[gid] = (state.wrong[gid]||0) + 1;
    saveState();
    if(mode === 'practice'){
      fb.innerHTML += '<div style="margin-top:8px"><button class="btn btn-accent" onclick="render()">下一题 →</button></div>';
    } else {
      fb.innerHTML += '<div style="margin-top:8px"><button class="btn btn-green" onclick="retry('+gid+')">🔁 重练这道</button></div>';
    }
  }
}

function retry(gid){
  const cardEl = document.querySelector('.card[data-gid="'+gid+'"]');
  if(!cardEl) return;
  cardEl.querySelectorAll('.opt').forEach(o=>{
    o.classList.remove('sel','correct','wrong','miss');
    o.style.pointerEvents = '';
  });
  cardEl.querySelector('.feedback').className = 'feedback';
  cardEl.querySelector('.feedback').innerHTML = '';
}

function gidsToCode(gids){
  const bits = new Uint8Array(Math.ceil(TOTAL/8));
  gids.forEach(g=>{ const idx=g-1; bits[Math.floor(idx/8)] |= (1<<(idx%8)); });
  let bin=''; bits.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/=+$/,'');
}
function codeToGids(code){
  try{
    code=code.trim(); while(code.length%4!==0) code+='=';
    const bin=atob(code); const bits=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bits[i]=bin.charCodeAt(i);
    const gids=[];
    for(let g=1;g<=TOTAL;g++){ const idx=g-1; if(bits[Math.floor(idx/8)]&(1<<(idx%8))) gids.push(g); }
    return gids;
  }catch(e){ return null; }
}
function doExport(){
  const gids = Object.keys(state.wrong).map(Number);
  if(gids.length===0){ toast('错题本为空'); return; }
  const code = gidsToCode(gids);
  copyText(code).then(()=>toast('✅ 已复制 '+gids.length+' 道错题码')).catch(()=>prompt('手动复制：', code));
}
function openImport(){ document.getElementById('importModal').classList.add('show'); }
function closeImport(){ document.getElementById('importModal').classList.remove('show'); }
function doImport(){
  const code = document.getElementById('importCode').value;
  const gids = codeToGids(code);
  if(!gids || gids.length===0){ toast('❌ 码无效'); return; }
  let added = 0;
  gids.forEach(g=>{ if(!state.wrong[g]){ state.wrong[g]=1; added++; } });
  saveState(); closeImport(); document.getElementById('importCode').value='';
  toast('✅ 导入 '+gids.length+' 道（新增 '+added+' 道）');
  render();
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
  return new Promise((res,rej)=>{
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); res(); }catch(e){ rej(e); }
    document.body.removeChild(ta);
  });
}
function resetAll(){
  if(confirm('确定清空所有进度吗？')){
    try{ localStorage.removeItem(STORE); }catch(e){}
    state = { wrong:{}, done:{} };
    render(); toast('已清空');
  }
}
function toast(t){
  const m=document.getElementById('msg'); m.textContent=t; m.classList.add('show');
  clearTimeout(m._t); m._t=setTimeout(()=>m.classList.remove('show'),1800);
}

render();

// ===== URL 参数自动导入（点链接即恢复错题）=====
try{
  const params = new URLSearchParams(location.search);
  const imp = params.get('import');
  if(imp){
    const gids = codeToGids(imp);
    if(gids && gids.length > 0){
      let added = 0;
      gids.forEach(g => { if(!state.wrong[g]){ state.wrong[g] = 1; added++; } });
      saveState();
      setMode('wrong');
      toast('✅ 已自动恢复 ' + gids.length + ' 道错题');
    }
  }
}catch(e){}
